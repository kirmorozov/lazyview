[package]
name = "lazyview"
version = "0.1.0"
edition = "2021"
description = "Materialized views for MySQL/MariaDB/Percona maintained from the binlog"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lazyview"
path = "src/main.rs"

[dependencies]
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12", "binlog"] }
sqlparser = { version = "0.63", features = ["visitor"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
serde_json = "1"
roaring = "0.11"

[dev-dependencies]
rand = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
