[package]
name = "lazyview"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Materialized views for MySQL/MariaDB/Percona maintained from the binlog"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lazyview"
path = "src/main.rs"

[dependencies]
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12", "binlog"] }
# PostgreSQL targets (src/target/postgres.rs). rustls, not OpenSSL: the musl binaries of
# `make cross` (Makefile:23,68-73) build `ring` already for mysql_async (Cargo.lock:
# rustls 0.23.46, ring 0.17.14), so this adds no new C toolchain dependency; postgres-openssl
# is deliberately not used. No `with-*` type features: values cross as PG text (see
# src/target/postgres.rs), so chrono / serde_json / uuid are not needed.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "webpki-roots"] }
# The rustls already in Cargo.lock, named so `PgConn::connect` can build its `ClientConfig`
# explicitly with the ring provider (the crate's `with_webpki_roots()` would use the
# process-default provider); `webpki-roots` are its default roots and `rustls-pemfile` reads
# an `sslrootcert` file (D11).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1.0"
sqlparser = { version = "0.64", features = ["visitor"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
serde_json = { version = "1", features = ["float_roundtrip"] }
# Opt-in OpenTelemetry (`LAZYVIEW_OTEL=otlp`, src/otel.rs, docs/configuration.md "OpenTelemetry").
# The official SDK (owner 2026-11-14; the naming and the copy-set terms are the lwf agreement in
# tmp/out/lwf-coordination/otel-agreement.md). Versions are pinned here and announced to lwf, whose
# verbatim copy of `src/otel.rs` aligns on them; OTLP/gRPC rides the same tonic/prost lazy-wire-fire
# uses. `default-features = false` everywhere: the OTLP http/* transports (reqwest + prost) are not
# taken on — `OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf` is refused with one WARN (src/otel.rs) —
# and `metrics` / `logs` arrive with their own PRs. `rt-tokio` is not needed: the SDK's batch
# processor runs on its own thread (`futures_executor::block_on`), the provider is built inside the
# engine's runtime, as tonic requires.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry-semantic-conventions = { version = "0.33.1", default-features = false }
# Resolved secret references (`src/secrets.rs`) are cleared when the last handle drops. The
# crate is already in the tree (rustls, tls_codec), so this names an existing dependency.
zeroize = "1"
roaring = { version = "0.12", optional = true }
# `aws-secrets` only: `aws-secret://` references (src/secrets.rs). Not in the default build.
aws-config = { version = "1", optional = true }
aws-sdk-secretsmanager = { version = "1", optional = true }
foldhash = "0.2"

[features]
# `roaring` switches src/intset.rs to its RoaringTreemap backend (meant for
# dense id ranges; the default plain hash set is the general choice). It is
# the only user of the optional `roaring` dependency. lazy-wire-fire declares
# the same `roaring = ["dep:roaring"]`; the cfg name in src/intset.rs is the contract.
roaring = ["dep:roaring"]
# `aws-secrets` enables `aws-secret://<secret-id>[#<json-field>]` secret references
# (src/secrets.rs) with AWS Secrets Manager GetSecretValue and the DEFAULT AWS credential
# chain (environment, IRSA, instance profile; never anything from the lazyview
# configuration). Off by default: a build without it refuses such a reference loudly
# instead of treating the URI as a password, and pays no aws-config / aws-sdk cost.
aws-secrets = ["dep:aws-config", "dep:aws-sdk-secretsmanager"]

[dev-dependencies]
rand = "0.10"
# `lock_task_tests` drives the leadership-lock task on a *paused* tokio clock, so the script and
# not the runner's scheduler decides how far the beat loop's own clock moves (`engine.rs`'s
# `drive`, #375). `test-util` is what `Builder::start_paused` and a paused `tokio::time::Instant`
# need. It is a dev-dependency feature only: edition 2021's resolver v2 keeps it out of the
# library and the binary, and `cargo build --release` never sees it.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
