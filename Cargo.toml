[package]
name = "lazyview"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Materialized views for MySQL/MariaDB/Percona maintained from the binlog"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lazyview"
path = "src/main.rs"

[dependencies]
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12", "binlog"] }
# PostgreSQL targets (src/target/postgres.rs). rustls, not OpenSSL: the musl binaries of
# `make cross` (Makefile:23,68-73) build `ring` already for mysql_async (Cargo.lock:
# rustls 0.23.46, ring 0.17.14), so this adds no new C toolchain dependency; postgres-openssl
# is deliberately not used. No `with-*` type features: values cross as PG text (see
# src/target/postgres.rs), so chrono / serde_json / uuid are not needed.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "webpki-roots"] }
# The rustls already in Cargo.lock, named so `PgConn::connect` can build its `ClientConfig`
# explicitly with the ring provider (the crate's `with_webpki_roots()` would use the
# process-default provider); `webpki-roots` are its default roots and `rustls-pemfile` reads
# an `sslrootcert` file (D11).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1.0"
sqlparser = { version = "0.63", features = ["visitor"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
serde_json = { version = "1", features = ["float_roundtrip"] }
roaring = { version = "0.12", optional = true }
foldhash = "0.2"

[features]
# `roaring` switches src/intset.rs to its RoaringTreemap backend (meant for
# dense id ranges; the default plain hash set is the general choice). It is
# the only user of the optional `roaring` dependency. lazy-wire-fire declares
# the same `roaring = ["dep:roaring"]`; the cfg name in src/intset.rs is the contract.
roaring = ["dep:roaring"]

[dev-dependencies]
rand = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
