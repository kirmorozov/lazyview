  # ---- Percona XtraDB Cluster 8.4 (Galera on MySQL, real MySQL GTIDs) ---------------------------
  # PXC's own requirement set for a continuous GTID state (gtid_mode + wsrep_gtid_mode + a fixed
  # wsrep_gtid_domain_id + log_replica_updates on every node); the lane resumes by GTID on any member.
  # The image is pinned by digest (its tag moves with PXC's own build number), and the SST hash key is
  # a fixed test value: all three nodes must share it, and the containers are dropped after every run.
  # Start order as in Galera: PXC_ADDRESS_1=gcomm:// + PXC_BOOTSTRAP=ON on node 1, then the docker0
  # addresses of the started nodes in PXC_ADDRESS_2/3. There is no wsrep_sst_auth here on purpose:
  # PXC 8.4 has no such server option (the server aborts with "unknown variable"), its entrypoint
  # authorizes SST from XTRADB_INTERNAL_HASH_KEY, which is why that key is shared by the three nodes.
  pxc84-1:
    <<: *mysql-common
    image: percona/percona-xtradb-cluster:8.4.11-12.1@sha256:1a93f0a886a23872f3fc97858ff3dc7c17664a77336a8c8f31de9e2b29c70907
    profiles: [cluster]
    ports: ["127.0.0.1:33611:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lvtest
      # Shared by the three nodes: PXC encrypts the SST stream with it, so a node that starts with a
      # different (or auto-generated) key cannot join. Test-only value, these containers never leave
      # the runner and are dropped with their volumes.
      XTRADB_INTERNAL_HASH_KEY: lv-test-sst-hash-key
      CLUSTER_NAME: lvpxc84
    command:
      - --server-id=33611
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
      - --wsrep-on=ON
      - --wsrep-provider=/usr/lib64/galera4/libgalera_smm.so
      - --wsrep-cluster-address=${PXC_ADDRESS_1:-gcomm://}
      - --wsrep-provider-options=pc.bootstrap=${PXC_BOOTSTRAP:-OFF};gcache.size=128M
      - --wsrep-node-name=pxc84-1
      - --wsrep-gtid-mode=ON
      - --wsrep-gtid-domain-id=42
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - pxc84-1:/var/lib/mysql

  pxc84-2:
    <<: *mysql-common
    image: percona/percona-xtradb-cluster:8.4.11-12.1@sha256:1a93f0a886a23872f3fc97858ff3dc7c17664a77336a8c8f31de9e2b29c70907
    profiles: [cluster]
    ports: ["127.0.0.1:33612:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lvtest
      XTRADB_INTERNAL_HASH_KEY: lv-test-sst-hash-key
      CLUSTER_NAME: lvpxc84
    command:
