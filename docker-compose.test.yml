  # ---- MariaDB Galera (wsrep_gtid_mode: the GTID state is cluster-continuous) --------------------
  # 3 x mariadb:11.4.13 (the LTS pin of mariadb114) with the galera-4 provider the image ships at
  # /usr/lib/galera/libgalera_smm.so. The four settings that make node-to-node resume work are
  # wsrep_on + wsrep_gtid_mode=ON + a fixed wsrep_gtid_domain_id + log_replica_updates: with them
  # every node's gtid_binlog_state carries the cluster's transactions under one domain-server, so a
  # saved cursor is a subset of any surviving member. wsrep_sst_auth uses the image's root account:
  # these are throwaway per-run containers (the lane always ends with `down -v`).
  # The lane starts node 1 with GALERA_BOOTSTRAP=ON and GALERA_ADDRESS_1=gcomm://, reads its docker0
  # address with `docker inspect`, then starts 2 and 3 with GALERA_ADDRESS_2/3=gcomm://<node1>:3306,
  # <node2>:3306. SST (mariabackup) is what costs the real minute here.
  galera114-1:
    <<: *mariadb-common
    image: mariadb:11.4.13
    profiles: [cluster]
    ports: ["127.0.0.1:33511:3306"]
    command:
      - --server-id=33511
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --log-slave-updates=ON
      - --gtid-strict-mode=ON
      - --wsrep-on=ON
      - --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      - --wsrep-cluster-address=${GALERA_ADDRESS_1:-gcomm://}
      - --wsrep-provider-options=pc.bootstrap=${GALERA_BOOTSTRAP:-OFF};gcache.size=128M
      - --wsrep-node-name=galera114-1
      - --wsrep-sst-auth=root:root
      - --wsrep-gtid-mode=ON
      - --wsrep-gtid-domain-id=42
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    healthcheck:
      test: ["CMD-SHELL", "mariadb --protocol=TCP -h127.0.0.1 -ulv -plv -NBe \"SHOW STATUS LIKE 'wsrep_local_state_comment'\" | grep -qw Synced"]
      interval: 3s
      timeout: 5s
      retries: 120
      start_period: 20s
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - galera114-1:/var/lib/mysql

  galera114-2:
    <<: *mariadb-common
    image: mariadb:11.4.13
    profiles: [cluster]
    ports: ["127.0.0.1:33512:3306"]
    command:
      - --server-id=33512
      - --log-bin=mariadb-bin
