# Integration-test database servers: the exact server builds CI runs, for local use too
# (same images, ports, credentials and settings as the tarball instances of
# scripts/test-servers.sh). Policy and lifecycle dates: docs/server-setup.md "Supported servers".
#
#   scripts/test-servers.sh compose up            # the blocking matrix (default profile, 12 servers:
#                                                 start only what you test, see Memory)
#   scripts/test-servers.sh compose up mysql2610  # one flavor
#   scripts/test-servers.sh compose up --pre      # plus the advisory pre-releases (2 more)
#   scripts/test-servers.sh compose up --chaos toxiproxy
#                                                 # plus the chaos proxy (profile `chaos`)
#   scripts/test-servers.sh dsns                  # LAZYVIEW_TEST_DSNS for the servers that are up
#   scripts/test-servers.sh compose down          # stop; `compose clean` also drops the data
#   pg16 (PostgreSQL 16, the *source matrix* baseline; also the *target* server of the postgres-
#   target jobs, read from LAZYVIEW_TEST_PG_DSNS): docker compose -f docker-compose.test.yml up -d --wait pg16
#   pg14/pg15/pg17/pg18/pg19rc2 (the other majors, pg14 AWS-only, pg19rc2 the pre-release; all
#   blocking except the advisory pre-release) — all six on one CI runner per job:
#   up -d --wait pg14 pg15 pg16 pg17 pg18 pg19rc2
#
# or plain compose:
#
#   docker compose -f docker-compose.test.yml up -d --wait mysql84
#   docker compose -f docker-compose.test.yml --profile prerelease up -d --wait
#   docker compose -f docker-compose.test.yml --profile chaos up -d --wait toxiproxy
#   LAZYVIEW_TEST_DSNS=mysql84=mysql://lv:lv@127.0.0.1:33084/lvtest cargo test --test '*' -- --test-threads=1
#   docker compose -f docker-compose.test.yml --profile prerelease down -v
#
# Service names are the flavor names of scripts/test-servers.sh, LAZYVIEW_TEST_DSNS and the CI
# matrix. Every server: ROW binlog, FULL row image, user lv/lv with ALL PRIVILEGES (created by
# docker/initdb on the first start), database lvtest, 128M InnoDB buffer pool (several servers
# share a developer host with the test runs), bound to 127.0.0.1, server id = host port. MySQL
# and Percona additionally run with GTIDs on (except mysql80 and percona84: GTIDs off, so both
# fence modes are tested per product). The flag lists are kept identical by hand (YAML
# cannot splice a shared list into `command`).
#
# Memory: MySQL and Percona run without performance_schema (about 250 MiB of their ~900 MiB idle
# footprint; lazyview does not use it) and with temptable_max_ram=1G (8.4 sizes it at 3% of the
# host's RAM, not the container's: 1.9 GiB on a 62 GB host) under a 3 GiB limit (at 2 GiB they
# were OOM-killed six times in a day on a shared developer host). MariaDB (performance_schema
# off by default, idle at 280-540 MiB) keeps 2 GiB.
#
# Durability: these are the server defaults (sync_binlog=1, innodb_flush_log_at_trx_commit=1),
# as in CI. scripts/test-servers.sh adds docker-compose.local.yml on a developer host, which
# drops the per-commit fsyncs (docs/development.md "Local speed settings").
#
# Matrix (one image per flavor, pinned to the exact build; the preview image by digest). Policy
# and dates: docs/server-setup.md "Supported servers".
#   blocking, LTS:             mysql84 mysql97 percona84 percona97 mariadb1011 mariadb114 mariadb118 mariadb123
#   blocking, latest GA:       mysql2610 mariadb130   (Percona has no Innovation line: 9.7 LTS is its latest)
#   blocking, AWS-only:        mysql80 mariadb106     (community EOL, still run by RDS / Aurora)
#   advisory, pre-release:     mariadb131-rc mariadb132-pre   (profile `prerelease`)
#   PostgreSQL (source+target): pg14 (AWS-only) pg15 pg16 pg17 pg18 blocking, pg19rc2 advisory
# PostgreSQL images are pinned by digest like the preview images above (tag + @sha256), per the
# database-matrix rule; lv-devops keeps the pins. These flavors are NOT in scripts/test-servers.sh's
# MATRIX_FLAVORS (its `dsns` and the default `compose up` list stay MySQL-only): the harness reads
# PG servers only from LAZYVIEW_TEST_PG_DSNS, so the tags here are shared with CI, not with that
# script.
# Percona publishes no pre-release; no registry has a MySQL one (26.10 went GA, no newer EA).
# The same tags and the preview digest as lazy-wire-fire's docker-compose.test.yml.
#
# Data lives in named volumes (lazyview_<flavor>): `down` keeps it, `down -v` drops it.

x-mysql-common: &mysql-common
  environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: lvtest
  volumes:
    - ./docker/initdb:/docker-entrypoint-initdb.d:ro
  healthcheck:
    # TCP (not the socket) so it only passes once the real server - not the
    # entrypoint's temporary init server - is up and the lv user exists.
    test: ["CMD", "mysql", "--protocol=TCP", "-h127.0.0.1", "-ulv", "-plv", "-e", "SELECT 1", "lvtest"]
    interval: 3s
    timeout: 5s
    retries: 60
    start_period: 20s
  deploy:
    resources:
      limits:
        memory: 3g
  restart: "no"

x-mariadb-common: &mariadb-common
  environment:
    MARIADB_ROOT_PASSWORD: root
    MARIADB_DATABASE: lvtest
  volumes:
    - ./docker/initdb:/docker-entrypoint-initdb.d:ro
  healthcheck:
    test: ["CMD", "mariadb", "--protocol=TCP", "-h127.0.0.1", "-ulv", "-plv", "-e", "SELECT 1", "lvtest"]
    interval: 3s
    timeout: 5s
    retries: 60
    start_period: 20s
  deploy:
    resources:
      limits:
        memory: 2g
  restart: "no"

# PostgreSQL, as a SOURCE and as a TARGET (issues #57/#56). The version matrix (owner's maximum-
# coverage rule, lead decisions 2026-11-13 and 2026-11-16): pg14 (AWS-only: community EOL
# 2026-11-12, still run by Amazon RDS — the mysql80/mariadb106 precedent), pg15, pg16 (the
# supported baseline), pg17 and pg18 (the latest GA) are BLOCKING; pg19rc2 is ADVISORY (Docker
# Hub has postgres:19rc2, no postgres:19 yet — the pre-release tier, like the MariaDB rc flavors).
# Majors share everything but image tag (each pinned by digest), host port and data volume; the CI
# `integration-pg` job uses them as targets (a MySQL-family source, LAZYVIEW_TEST_PG_DSNS) and
# `integration-pgsrc` runs the source gate on the majors it needs. `wal_level=logical` is what the
# logical-replication reader needs (the pgoutput decoder + the gated slot smoke); it is harmless for
# the target use too. Start one:
# docker compose -f docker-compose.test.yml up -d --wait pg16.
x-pg-common: &pg-common
  command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
  environment:
    POSTGRES_USER: lv
    POSTGRES_PASSWORD: lv
    POSTGRES_DB: lvtest
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U lv -d lvtest -h 127.0.0.1"]
    interval: 3s
    timeout: 5s
    retries: 60
  shm_size: 128mb
  mem_limit: 1g

services:
  # ---- MySQL: 8.0 (AWS-only), 8.4 LTS, 9.7 LTS, 26.10 Innovation (latest GA) ---------------------
  # Community EOL (April 2026) but still run by RDS for MySQL 8.0 and Aurora MySQL 3: the AWS-only
  # tier. To drop it: this service, its volume, the `mysql80` entry of the ci.yml matrix and its
  # pins in scripts/test-servers.sh.
  # GTIDs OFF here (as in a default RDS parameter group): the visibility fence falls back to the
  # fixed delay. The other MySQL / Percona servers run GTIDs ON; MariaDB has no switch.
  mysql80:
    <<: *mysql-common
    image: mysql:8.0.46
    ports: ["127.0.0.1:33080:3306"]
    command:
      - --server-id=33080
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mysql80:/var/lib/mysql

  mysql84:
    <<: *mysql-common
    image: mysql:8.4.13
    ports: ["127.0.0.1:33084:3306"]
    command:
      - --server-id=33084
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mysql84:/var/lib/mysql

  mysql97:
    <<: *mysql-common
    image: mysql:9.7.4
    ports: ["127.0.0.1:33097:3306"]
    command:
      - --server-id=33097
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mysql97:/var/lib/mysql

  mysql2610:
    <<: *mysql-common
    image: mysql:26.10.0
    ports: ["127.0.0.1:33261:3306"]
    command:
      - --server-id=33261
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mysql2610:/var/lib/mysql

  # ---- Percona Server: 8.4 LTS, 9.7 LTS -----------------------------------------------------
  # GTIDs OFF here too (one Percona line without them).
  percona84:
    <<: *mysql-common
    image: percona/percona-server:8.4.11-11
    ports: ["127.0.0.1:33184:3306"]
    command:
      - --server-id=33184
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - percona84:/var/lib/mysql

  percona97:
    <<: *mysql-common
    image: percona/percona-server:9.7.2-2
    ports: ["127.0.0.1:33197:3306"]
    command:
      - --server-id=33197
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - percona97:/var/lib/mysql

  # ---- MariaDB: 10.6 (AWS-only), 10.11 / 11.4 / 11.8 / 12.3 LTS, 13.0 rolling (latest GA) ---------
  # Community EOL (2026-07-06) but RDS for MariaDB 10.6 is supported to 2026-12-31: the AWS-only
  # tier (drop it like mysql80 above, after that date).
  mariadb106:
    <<: *mariadb-common
    image: mariadb:10.6.28
    ports: ["127.0.0.1:33106:3306"]
    command:
      - --server-id=33106
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb106:/var/lib/mysql

  mariadb1011:
    <<: *mariadb-common
    image: mariadb:10.11.19
    ports: ["127.0.0.1:33111:3306"]
    command:
      - --server-id=33111
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb1011:/var/lib/mysql

  mariadb114:
    <<: *mariadb-common
    image: mariadb:11.4.13
    ports: ["127.0.0.1:33114:3306"]
    command:
      - --server-id=33114
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb114:/var/lib/mysql

  # ---- PostgreSQL: the version matrix, used as a TARGET and as a SOURCE (issues #56/#57) ----------
  # A MySQL-family source maintains tables here (target, LAZYVIEW_TEST_PG_DSNS) and the source tests
  # stream from these same services (logical WAL). Not in scripts/test-servers.sh's matrix: the
  # harness reads them from LAZYVIEW_TEST_PG_DSNS, never from LAZYVIEW_TEST_DSNS. Every image is
  # pinned by digest (tag + @sha256), as the preview images above; lv-devops keeps the pins.
  # One template (x-pg-common), six majors differing only by image tag, host port and volume. The
  # CI jobs (`integration-pg`, `integration-pgsrc`) start them on one runner.
  # Ports: 35431..35434 + pg14 35436 + pg19rc2 35437 (pg16 keeps its historic 35432).
  pg14:
    <<: *pg-common
    image: postgres:14.25@sha256:c0e9c0e9bac7e4c1834b698217a03ee5c708de30d313c84a506972de0e24b059
    # AWS-only tier (mysql80/mariadb106 precedent): community EOL 2026-11-12, still run by Amazon RDS.
    ports: ["127.0.0.1:35436:5432"]
    volumes:
      - pg14:/var/lib/postgresql/data

  pg15:
    <<: *pg-common
    image: postgres:15.20@sha256:2663a9f0fde52de94f5dad3603a1942359f49472f1017c1a6d64f66bfedacb40
    ports: ["127.0.0.1:35431:5432"]
    volumes:
      - pg15:/var/lib/postgresql/data

  pg16:
    <<: *pg-common
    image: postgres:16.16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    ports: ["127.0.0.1:35432:5432"]
    volumes:
      - pg16:/var/lib/postgresql/data

  pg17:
    <<: *pg-common
    image: postgres:17.12@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    ports: ["127.0.0.1:35433:5432"]
    volumes:
      - pg17:/var/lib/postgresql/data

  pg18:
    <<: *pg-common
    image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    ports: ["127.0.0.1:35434:5432"]
    # PG18+ moved its data dir under a parent mount (docker-library/postgres#37): it wants a single
    # mount at /var/lib/postgresql and refuses to start when a volume is mounted at .../data. So this
    # one major overrides the template's data volume path; every other pg field is inherited.
    volumes:
      - pg18:/var/lib/postgresql

  # pg19rc2: the pre-release major (advisory tier — Docker Hub has postgres:19rc2, no postgres:19
  # yet; when 19.0 ships, move this service to the GA pin and make its CI steps blocking).
  pg19rc2:
    <<: *pg-common
    image: postgres:19rc2@sha256:15924313d5606f326836976643a5f681a64fb30f591e79fcb15e160979323802
    ports: ["127.0.0.1:35437:5432"]
    # 19 has the same parent-mount layout as 18 (see the pg18 note above).
    volumes:
      - pg19rc2:/var/lib/postgresql

  mariadb118:
    <<: *mariadb-common
    image: mariadb:11.8.9
    ports: ["127.0.0.1:33118:3306"]
    command:
      - --server-id=33118
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb118:/var/lib/mysql

  mariadb123:
    <<: *mariadb-common
    image: mariadb:12.3.3
    ports: ["127.0.0.1:33123:3306"]
    command:
      - --server-id=33123
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb123:/var/lib/mysql

  mariadb130:
    <<: *mariadb-common
    image: mariadb:13.0.2
    ports: ["127.0.0.1:33130:3306"]
    command:
      - --server-id=33130
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb130:/var/lib/mysql

  # ---- Advisory: pre-releases (profile `prerelease`, never required) ------------------------------
  # MariaDB 13.1.1 Release Candidate (Docker Hub), pinned by digest like lazy-wire-fire (the tag may move).
  mariadb131-rc:
    <<: *mariadb-common
    image: mariadb:13.1.1-rc@sha256:a652753786e98d9f976aaab8cc21e49c16ea0cfe41a877694825a6ea73140fb1
    profiles: [prerelease]
    ports: ["127.0.0.1:33131:3306"]
    command:
      - --server-id=33131
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb131-rc:/var/lib/mysql

  # MariaDB 13.2.0 Preview: no Docker Hub image, the MariaDB Foundation's devel image pinned by
  # digest (tag 13.2-preview moves).
  mariadb132-pre:
    <<: *mariadb-common
    image: quay.io/mariadb-foundation/mariadb-devel:13.2-preview@sha256:b065780c004aa1031ec674444d47667530c025c17d27b9ed35750b0394d7b6bb
    profiles: [prerelease]
    ports: ["127.0.0.1:33132:3306"]
    command:
      - --server-id=33132
      # This preview image's my.cnf puts the socket and pid file under /run/mariadbd, which the
      # image does not create (the entrypoint dies with "find: '/run/mariadbd': No such file",
      # the server with "can't create PID file"), and its data directory /var/lib/mariadb
      # (renamed in 13.2) ships pre-initialized, so the entrypoint would skip the first-start
      # setup (root password, lvtest, docker/initdb). Use the paths the other images use.
      - --socket=/run/mysqld/mysqld.sock
      - --pid-file=/run/mysqld/mysqld.pid
      - --datadir=/var/lib/mysql
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb132-pre:/var/lib/mysql

  # ---- cluster families (profile `cluster`; the single-server lanes never depend on them) --------
  # The HA source topologies of the resume-by-GTID work (review A-01: "a change of source server ends
  # in a stop or in a rebuild of every view"). The CI lanes are `failover-async`, `galera114`, `pxc84`
  # and `gr84` in .github/workflows/ci.yml; they start these services in the order each family needs
  # and assert the topology really formed (3/3 members, a running applier) before they run anything.
  #
  # Why `network_mode: bridge` instead of the compose project network: this host runs several suites at
  # once, so a per-project network would be one more shared network per run (and `docker network
  # create` is forbidden on it). Every one of these services therefore sits on docker0, which has two
  # consequences the CI jobs handle:
  #   - nodes address each other by the docker0 address the job reads with `docker inspect`
  #     (no service-name DNS on the default bridge), and
  #   - the seed address of a second/third node, or of a replica, is composed at start time from that
  #     address: hence the ${GALERA_*} / ${GR_*} / ${REPLICA_*} interpolation below, and the
  #     start-on-boot=off options that let the job configure replication and GR after the server is up.
  # MariaDB keeps its own names for the two replica-facing options (11.4's image refuses the MySQL
  # 8.4 spelling: `--log-slave-updates`, `--skip-slave-start`) - the same server-side settings, the
  # flavor's own option names, as everywhere else the two families differ.
  #
  # They are NOT in scripts/test-servers.sh's MATRIX_FLAVORS (its `dsns` and the default `compose up`
  # list stay the single servers of the matrix), and they sit behind the `cluster` profile, so
  #   docker compose -f docker-compose.test.yml up -d galera114-1   # explicit name: profile not needed
  # is how a lane (or a developer) starts one; `down -v` drops the data.
  #
  # Memory: one family at a time on a developer host (3 nodes x 2-3 GiB ceiling); the pairs are the
  # same size as the single servers they copy. Ports: pairs 334xx, Galera 335xx, PXC 336xx, GR 337xx.
  #
  # ---- async primary/replica pairs (the RDS Multi-AZ / promoted-replica shape) -------------------
  # The core A-01 shape: the writer and a promoted-replica candidate of the same flavor. Both have
  # binlog + GTIDs so either can be the binlog source; `log_replica_updates` is what makes the
  # replica's binlog hold the primary's transactions (without it a promoted replica cannot be read).
  # The replica is read-only for a non-SUPER account (the engine account of docs/server-setup.md): a
  # reader is a reader. The CI job wires the channel with CHANGE REPLICATION SOURCE (GTID
  # auto-position), which is also the "repoint the DSN" promotion the failover tests use.
  mysql84a:
    # The primary of the async pair (image and flags of mysql84 above, plus the replica-facing ones).
    <<: *mysql-common
    image: mysql:8.4.13
    profiles: [cluster]
    ports: ["127.0.0.1:33484:3306"]
    command:
      - --server-id=33484
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --binlog-row-metadata=FULL
