      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
      - --wsrep-on=ON
      - --wsrep-provider=/usr/lib64/galera4/libgalera_smm.so
      - --wsrep-cluster-address=${PXC_ADDRESS_2:-gcomm://}
      - --wsrep-provider-options=gcache.size=128M
      - --wsrep-node-name=pxc84-2
      - --wsrep-gtid-mode=ON
      - --wsrep-gtid-domain-id=42
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - pxc84-2:/var/lib/mysql

  pxc84-3:
    <<: *mysql-common
    image: percona/percona-xtradb-cluster:8.4.11-12.1@sha256:1a93f0a886a23872f3fc97858ff3dc7c17664a77336a8c8f31de9e2b29c70907
    profiles: [cluster]
    ports: ["127.0.0.1:33613:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lvtest
      XTRADB_INTERNAL_HASH_KEY: lv-test-sst-hash-key
      CLUSTER_NAME: lvpxc84
    command:
      - --server-id=33613
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
      - --wsrep-on=ON
      - --wsrep-provider=/usr/lib64/galera4/libgalera_smm.so
      - --wsrep-cluster-address=${PXC_ADDRESS_3:-gcomm://}
      - --wsrep-provider-options=gcache.size=128M
      - --wsrep-node-name=pxc84-3
      - --wsrep-gtid-mode=ON
      - --wsrep-gtid-domain-id=42
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - pxc84-3:/var/lib/mysql

  # ---- MySQL Group Replication / InnoDB Cluster, single primary ---------------------------------
  # 3 x mysql:8.4.13 (the mysql84 pin). GTIDs are mandatory in GR, and the transactions carry the
  # GROUP uuid, not the member's, so gtid_executed converges on every member and a primary change is a
  # non-event for the cursor. group_replication_start_on_boot=OFF: the docker0 address of a node is
  # only known once it is up, so the lane sets group_replication_local_address and the seeds with
  # SET GLOBAL (both dynamic) and bootstraps node 1 with START GROUP_REPLICATION.
  # group_replication_local_address uses port 33061 on each node's own docker0 address; the nodes talk
  # to each other on docker0, nothing here publishes those ports.
  # The three group_replication mode flags are interpolated (GR_SINGLE_PRIMARY / GR_ENFORCE_EVERYWHERE
  # / GR_ISOLATION, defaulting to single primary): the blocking `gr84` lane runs the group as
  # single-primary and the advisory nightly `gr84-mp` starts the same three services in multi-primary
  # mode - one definition of the topology, not two that can drift apart.
  gr84-1:
    <<: *mysql-common
    image: mysql:8.4.13
    profiles: [cluster]
    ports: ["127.0.0.1:33711:3306"]
    command:
      - --server-id=33711
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --skip-name-resolve
      - --mysqlx=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
      - --plugin-load-add=group_replication.so
      - --loose-group-replication-group-name=11111111-1111-1111-1111-111111111111
      - --loose-group-replication-start-on-boot=OFF
      - --loose-group-replication-single-primary-mode=${GR_SINGLE_PRIMARY:-ON}
      - --loose-group-replication-enforce-update-everywhere-checks=${GR_ENFORCE_EVERYWHERE:-OFF}
      - --transaction-isolation=${GR_ISOLATION:-REPEATABLE-READ}
      - --loose-group-replication-member-weight=100
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - gr84-1:/var/lib/mysql

  gr84-2:
    <<: *mysql-common
    image: mysql:8.4.13
    profiles: [cluster]
    ports: ["127.0.0.1:33712:3306"]
    command:
      - --server-id=33712
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --skip-name-resolve
