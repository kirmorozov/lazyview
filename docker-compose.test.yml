# Integration-test database servers: the exact server builds CI runs, for local use too
# (same images, ports, credentials and settings as the tarball instances of
# scripts/test-servers.sh). Policy and lifecycle dates: docs/server-setup.md "Supported servers".
#
#   scripts/test-servers.sh compose up            # the blocking matrix (default profile, 12 servers:
#                                                 start only what you test, see Memory)
#   scripts/test-servers.sh compose up mysql2610  # one flavor
#   scripts/test-servers.sh compose up --pre      # plus the advisory pre-releases (2 more)
#   scripts/test-servers.sh compose up --chaos toxiproxy
#                                                 # plus the chaos proxy (profile `chaos`)
#   scripts/test-servers.sh dsns                  # LAZYVIEW_TEST_DSNS for the servers that are up
#   scripts/test-servers.sh compose down          # stop; `compose clean` also drops the data
#   pg16 (PostgreSQL 16, a *target* service outside the matrix: the harness reads it from
#   LAZYVIEW_TEST_PG_DSNS): docker compose -f docker-compose.test.yml up -d --wait pg16
#
# or plain compose:
#
#   docker compose -f docker-compose.test.yml up -d --wait mysql84
#   docker compose -f docker-compose.test.yml --profile prerelease up -d --wait
#   docker compose -f docker-compose.test.yml --profile chaos up -d --wait toxiproxy
#   LAZYVIEW_TEST_DSNS=mysql84=mysql://lv:lv@127.0.0.1:33084/lvtest cargo test --test '*' -- --test-threads=1
#   docker compose -f docker-compose.test.yml --profile prerelease down -v
#
# Service names are the flavor names of scripts/test-servers.sh, LAZYVIEW_TEST_DSNS and the CI
# matrix. Every server: ROW binlog, FULL row image, user lv/lv with ALL PRIVILEGES (created by
# docker/initdb on the first start), database lvtest, 128M InnoDB buffer pool (several servers
# share a developer host with the test runs), bound to 127.0.0.1, server id = host port. MySQL
# and Percona additionally run with GTIDs on (except mysql80 and percona84: GTIDs off, so both
# fence modes are tested per product). The flag lists are kept identical by hand (YAML
# cannot splice a shared list into `command`).
#
# Memory: MySQL and Percona run without performance_schema (about 250 MiB of their ~900 MiB idle
# footprint; lazyview does not use it) and with temptable_max_ram=1G (8.4 sizes it at 3% of the
# host's RAM, not the container's: 1.9 GiB on a 62 GB host) under a 3 GiB limit (at 2 GiB they
# were OOM-killed six times in a day on a shared developer host). MariaDB (performance_schema
# off by default, idle at 280-540 MiB) keeps 2 GiB.
#
# Durability: these are the server defaults (sync_binlog=1, innodb_flush_log_at_trx_commit=1),
# as in CI. scripts/test-servers.sh adds docker-compose.local.yml on a developer host, which
# drops the per-commit fsyncs (docs/development.md "Local speed settings").
#
# Matrix (one image per flavor, pinned to the exact build; the preview image by digest). Policy
# and dates: docs/server-setup.md "Supported servers".
#   blocking, LTS:             mysql84 mysql97 percona84 percona97 mariadb1011 mariadb114 mariadb118 mariadb123
#   blocking, latest GA:       mysql2610 mariadb130   (Percona has no Innovation line: 9.7 LTS is its latest)
#   blocking, AWS-only:        mysql80 mariadb106     (community EOL, still run by RDS / Aurora)
#   advisory, pre-release:     mariadb131-rc mariadb132-pre   (profile `prerelease`)
# Percona publishes no pre-release; no registry has a MySQL one (26.10 went GA, no newer EA).
# The same tags and the preview digest as lazy-wire-fire's docker-compose.test.yml.
#
# Data lives in named volumes (lazyview_<flavor>): `down` keeps it, `down -v` drops it.

x-mysql-common: &mysql-common
  environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: lvtest
  volumes:
    - ./docker/initdb:/docker-entrypoint-initdb.d:ro
  healthcheck:
    # TCP (not the socket) so it only passes once the real server - not the
    # entrypoint's temporary init server - is up and the lv user exists.
    test: ["CMD", "mysql", "--protocol=TCP", "-h127.0.0.1", "-ulv", "-plv", "-e", "SELECT 1", "lvtest"]
    interval: 3s
    timeout: 5s
    retries: 60
    start_period: 20s
  deploy:
    resources:
      limits:
        memory: 3g
  restart: "no"

x-mariadb-common: &mariadb-common
  environment:
    MARIADB_ROOT_PASSWORD: root
    MARIADB_DATABASE: lvtest
  volumes:
    - ./docker/initdb:/docker-entrypoint-initdb.d:ro
  healthcheck:
    test: ["CMD", "mariadb", "--protocol=TCP", "-h127.0.0.1", "-ulv", "-plv", "-e", "SELECT 1", "lvtest"]
    interval: 3s
    timeout: 5s
    retries: 60
    start_period: 20s
  deploy:
    resources:
      limits:
        memory: 2g
  restart: "no"

services:
  # ---- MySQL: 8.0 (AWS-only), 8.4 LTS, 9.7 LTS, 26.10 Innovation (latest GA) ---------------------
  # Community EOL (April 2026) but still run by RDS for MySQL 8.0 and Aurora MySQL 3: the AWS-only
  # tier. To drop it: this service, its volume, the `mysql80` entry of the ci.yml matrix and its
  # pins in scripts/test-servers.sh.
  # GTIDs OFF here (as in a default RDS parameter group): the visibility fence falls back to the
  # fixed delay. The other MySQL / Percona servers run GTIDs ON; MariaDB has no switch.
  mysql80:
    <<: *mysql-common
    image: mysql:8.0.46
    ports: ["127.0.0.1:33080:3306"]
    command:
      - --server-id=33080
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mysql80:/var/lib/mysql

  mysql84:
    <<: *mysql-common
    image: mysql:8.4.13
    ports: ["127.0.0.1:33084:3306"]
    command:
      - --server-id=33084
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mysql84:/var/lib/mysql

  mysql97:
    <<: *mysql-common
    image: mysql:9.7.4
    ports: ["127.0.0.1:33097:3306"]
    command:
      - --server-id=33097
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mysql97:/var/lib/mysql

  mysql2610:
    <<: *mysql-common
    image: mysql:26.10.0
    ports: ["127.0.0.1:33261:3306"]
    command:
      - --server-id=33261
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mysql2610:/var/lib/mysql

  # ---- Percona Server: 8.4 LTS, 9.7 LTS -----------------------------------------------------
  # GTIDs OFF here too (one Percona line without them).
  percona84:
    <<: *mysql-common
    image: percona/percona-server:8.4.11-11
    ports: ["127.0.0.1:33184:3306"]
    command:
      - --server-id=33184
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - percona84:/var/lib/mysql

  percona97:
    <<: *mysql-common
    image: percona/percona-server:9.7.2-2
    ports: ["127.0.0.1:33197:3306"]
    command:
      - --server-id=33197
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --skip-name-resolve
      - --mysqlx=OFF
      - --performance-schema=OFF
      - --temptable-max-ram=1G
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - percona97:/var/lib/mysql

  # ---- MariaDB: 10.6 (AWS-only), 10.11 / 11.4 / 11.8 / 12.3 LTS, 13.0 rolling (latest GA) ---------
  # Community EOL (2026-07-06) but RDS for MariaDB 10.6 is supported to 2026-12-31: the AWS-only
  # tier (drop it like mysql80 above, after that date).
  mariadb106:
    <<: *mariadb-common
    image: mariadb:10.6.28
    ports: ["127.0.0.1:33106:3306"]
    command:
      - --server-id=33106
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb106:/var/lib/mysql

  mariadb1011:
    <<: *mariadb-common
    image: mariadb:10.11.19
    ports: ["127.0.0.1:33111:3306"]
    command:
      - --server-id=33111
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb1011:/var/lib/mysql

  mariadb114:
    <<: *mariadb-common
    image: mariadb:11.4.13
    ports: ["127.0.0.1:33114:3306"]
    command:
      - --server-id=33114
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb114:/var/lib/mysql

  # PostgreSQL as a target (issue #56) and, later, as a source (issue #57, logical
  # replication): a MySQL-family source maintains tables here, and the source tests stream
  # from this same service (logical WAL). Not in scripts/test-servers.sh's matrix: the
  # harness reads it from LAZYVIEW_TEST_PG_DSNS, never from LAZYVIEW_TEST_DSNS. Pin the
  # exact patch build, as the MySQL services above do; lv-devops keeps the pin.
  pg16:
    image: postgres:16.16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    ports: ["127.0.0.1:35432:5432"]
    environment:
      POSTGRES_USER: lv
      POSTGRES_PASSWORD: lv
      POSTGRES_DB: lvtest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lv -d lvtest -h 127.0.0.1"]
      interval: 3s
      timeout: 5s
      retries: 60
    shm_size: 128mb
    mem_limit: 1g
    volumes:
      - pg16:/var/lib/postgresql/data

  mariadb118:
    <<: *mariadb-common
    image: mariadb:11.8.9
    ports: ["127.0.0.1:33118:3306"]
    command:
      - --server-id=33118
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb118:/var/lib/mysql

  mariadb123:
    <<: *mariadb-common
    image: mariadb:12.3.3
    ports: ["127.0.0.1:33123:3306"]
    command:
      - --server-id=33123
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb123:/var/lib/mysql

  mariadb130:
    <<: *mariadb-common
    image: mariadb:13.0.2
    ports: ["127.0.0.1:33130:3306"]
    command:
      - --server-id=33130
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb130:/var/lib/mysql

  # ---- Advisory: pre-releases (profile `prerelease`, never required) ------------------------------
  # MariaDB 13.1.1 Release Candidate (Docker Hub), pinned by digest like lazy-wire-fire (the tag may move).
  mariadb131-rc:
    <<: *mariadb-common
    image: mariadb:13.1.1-rc@sha256:a652753786e98d9f976aaab8cc21e49c16ea0cfe41a877694825a6ea73140fb1
    profiles: [prerelease]
    ports: ["127.0.0.1:33131:3306"]
    command:
      - --server-id=33131
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb131-rc:/var/lib/mysql

  # MariaDB 13.2.0 Preview: no Docker Hub image, the MariaDB Foundation's devel image pinned by
  # digest (tag 13.2-preview moves).
  mariadb132-pre:
    <<: *mariadb-common
    image: quay.io/mariadb-foundation/mariadb-devel:13.2-preview@sha256:b065780c004aa1031ec674444d47667530c025c17d27b9ed35750b0394d7b6bb
    profiles: [prerelease]
    ports: ["127.0.0.1:33132:3306"]
    command:
      - --server-id=33132
      # This preview image's my.cnf puts the socket and pid file under /run/mariadbd, which the
      # image does not create (the entrypoint dies with "find: '/run/mariadbd': No such file",
      # the server with "can't create PID file"), and its data directory /var/lib/mariadb
      # (renamed in 13.2) ships pre-initialized, so the entrypoint would skip the first-start
      # setup (root password, lvtest, docker/initdb). Use the paths the other images use.
      - --socket=/run/mysqld/mysqld.sock
      - --pid-file=/run/mysqld/mysqld.pid
      - --datadir=/var/lib/mysql
      - --log-bin=mariadb-bin
      - --log-basename=mariadb
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --skip-name-resolve
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb132-pre:/var/lib/mysql

  # ---- chaos: Toxiproxy (profile `chaos`; nothing in the default stack depends on it) ----------
  # Network-layer faults for tests/chaos.rs (docs/development.md "Chaos tests"). The engine and the
  # targets are reached through proxies the tests create and delete over the API; the harness itself
  # never starts a container. One daemon for the whole host (the upstream's own recommendation):
  # every test's proxies are named lv_<schema>_<role> and removed on Drop.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0      # 2026-10-14; newest release (F1)
    profiles: [chaos]
    # API on loopback only (the API can proxy to any upstream, D5) + the fixed band the harness
    # allocates proxy listen ports from. Published, not `network_mode: host`: the test binary runs
    # on the host and the servers are reachable by service name on this compose network.
    ports:
      - "127.0.0.1:18474:8474"
      - "127.0.0.1:17100-17199:17100-17199"
    # so upstream `host.docker.internal:<host port>` also works: the tarball mode of
    # scripts/test-servers.sh runs servers on the host, not on this network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 3s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 128m
    restart: "no"

volumes:
  mysql80:
  mysql84:
  mysql97:
  mysql2610:
  percona84:
  percona97:
  mariadb106:
  mariadb1011:
  mariadb114:
  mariadb118:
  mariadb123:
  mariadb130:
  mariadb131-rc:
  mariadb132-pre:
  pg16:
