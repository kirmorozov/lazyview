{{/*
Voluntary disruptions (node drains) take one pod at a time. A healthy standby and an active pod
that streams the binlog are both Ready (readinessProbe /readyz?standby=ok&building=ok), so a drain
is allowed whenever both pods are healthy and waits only while the other pod is not, e.g. until the
replacement of the previously evicted pod is a standby again.

Evicting the active pod hands over to the standby within seconds. A view build in progress (a first
version on the first deploy, after LAZYVIEW_START_MODE=rebuild, a purged binlog or a new definition,
or a new version behind a live table) starts over on the new active pod, so avoid drains and
rollouts during long builds.
*/}}
{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lazyview.fullname" . }}
  labels:
    {{- include "lazyview.componentLabels" (dict "root" . "component" "replicator") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.pdb.minAvailable }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable | default 1 }}
  {{- end }}
  # Pods that are not Ready (crash-looping, still booting) never block a drain.
  unhealthyPodEvictionPolicy: {{ .Values.pdb.unhealthyPodEvictionPolicy }}
  selector:
    matchLabels:
      {{- include "lazyview.selectorLabels" . | nindent 6 }}
{{- end }}
