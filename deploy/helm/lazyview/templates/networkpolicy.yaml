{{/*
Restricts who may connect to lazyview: it serves nothing but port 8080 (/metrics and the probe
endpoints), and only Prometheus needs it. Kubelet probes come from the pod's own node, which
NetworkPolicy always allows. Egress (DNS, the databases) is not restricted here — the databases are
reachable from every node in practice, and an egress rule would have to name them.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lazyview.fullname" . }}
  labels:
    {{- include "lazyview.componentLabels" (dict "root" . "component" "network") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "lazyview.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # A rule without `from` would allow every source, so the selectors are required.
    - from:
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- range .Values.networkPolicy.allowFromPods }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        # The container port by name, so it follows `containerPort`.
        - port: http
          protocol: TCP
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
