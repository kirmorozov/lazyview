# The chart's own alert rules: the same set as deploy/k8s/components/prometheus/prometheusrule.yaml,
# which alerts on what the probes deliberately ignore (a restart would not fix those).
#
# This file lives under files/ rather than templates/ on purpose: Helm does not process files/, so
# the Prometheus template expansions ({{ $labels.job }}) stay literal instead of being read as Go
# template actions. templates/prometheusrule.yaml loads it with .Files.Get, substitutes the two
# selector tokens on the expr lines below (LV_METRICS_SERVICE and LV_DEPLOYMENT, each wrapped in two
# underscores on both sides) with the names THIS release renders, and renders it under spec:; set
# prometheus.rules.groups to replace these rules with your own.
#
# The selectors are exact names, not a substring match, so a differently named deployment can never
# answer for this one and a rule can never go silent when nameOverride / fullnameOverride produce a
# name that does not contain "lazyview". The `job` label of a scraped pod is the name of the Service
# the ServiceMonitor selects, which is what the LV_METRICS_SERVICE token becomes.
#
# Spell the marker prefix nowhere in this comment block: templates/prometheusrule.yaml refuses the
# render while any marker survives substitution, so that a token the two files disagree on can never
# ship as a literal in a selector, and that guard cannot tell a documented example from a real token.
groups:
  - name: lazyview
    rules:
      - alert: LazyviewDown
        # Pods exist but none answers the scrape (crash loop, image pull or configuration
        # errors: the Service also publishes pods that are not ready).
        expr: max by (namespace, job) (up{job="__LV_METRICS_SERVICE__"}) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: No lazyview pod of {{ $labels.job }} in {{ $labels.namespace }} can be scraped.
      - alert: LazyviewUnavailable
        # No pod is Ready, including pods that never got an IP (Pending, unschedulable), which
        # LazyviewDown cannot see. Needs kube-state-metrics (part of kube-prometheus-stack).
        expr: max by (namespace, deployment) (kube_deployment_status_replicas_available{deployment="__LV_DEPLOYMENT__"}) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Deployment {{ $labels.deployment }} in {{ $labels.namespace }} has no available pod.
      - alert: LazyviewNotScraped
        # Cluster-wide: Prometheus has no lazyview target at all (e.g. the ServiceMonitor lacks
        # the `release` label kube-prometheus-stack selects on).
        expr: absent(up{job="__LV_METRICS_SERVICE__"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Prometheus scrapes no lazyview target.
      - alert: LazyviewNotStreaming
        # Pods are scraped but none holds the lock and streams the binlog: database unreachable,
        # missing grants, purged binlog, a takeover still booting, or the lock still held by the
        # session of a pod whose node died (see the note on replicas in values.yaml).
        expr: max by (namespace, job) (lazyview_streaming) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: No lazyview pod of {{ $labels.job }} in {{ $labels.namespace }} is streaming the binlog.
      - alert: LazyviewViewsInError
        expr: max by (namespace, job) (lazyview_views_error) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} lazyview view(s) of {{ $labels.job }} in {{ $labels.namespace }} in error"
          description: "SELECT name, target, last_error FROM _lazyview_state WHERE state = 'error'"
      - alert: LazyviewViewsNotLive
        # Views without a live version for 2 h (initial build very slow or stuck). The
        # Kubernetes readiness probe ignores first builds (building=ok); this alert does not.
        expr: max by (namespace, job) (lazyview_views - lazyview_views_ready - lazyview_views_error) > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} lazyview view(s) of {{ $labels.job }} in {{ $labels.namespace }} have no live table yet."
      - alert: LazyviewRefreshFailing
        # A view whose refresh fails on every attempt keeps its live version and stays
        # `ready` (a failed refresh is retried with backoff, never re-planned or rebuilt —
        # owner rule), so LazyviewViewsInError cannot see it and /readyz stays green: this
        # gauge is the alert signal for that state (review A-03, O-02). The threshold 3 is
        # REFRESH_ERROR_SHOWN_AFTER (src/engine.rs) — the same streak at which the engine
        # writes `_lazyview_state.last_error`; `for: 2m` is longer than the 30 s cap of the
        # refresh retry backoff (src/engine.rs, supervisor::backoff on Policy::READS), so an
        # attempt that clears on its first retry never alerts. Both are engine settings, not
        # guesses; tune them together with the engine knobs they mirror.
        expr: max by (namespace, job, view) (lazyview_view_refresh_failures) >= 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "View {{ $labels.view }} of {{ $labels.job }} in {{ $labels.namespace }} has failed {{ $value }} refreshes in a row: it is stale while showing ready."
          description: "SELECT name, target, state, last_error, refreshed_at FROM _lazyview_state WHERE CONCAT('<schema>.', name) = '{{ $labels.view }}' (the label is schema.view; last_error is filled from the 3rd failure)"
      - alert: LazyviewRefreshErrors
        # Backstop for the rule above: `refresh_errors` (src/metrics.rs) counts every failed
        # refresh attempt instance-wide, so a failure that never builds a streak on one view
        # (views rotating, restarts clearing the streak) still surfaces. The 30 m window
        # covers a full pass of the retry ladder to its 30 s cap (src/engine.rs); for: 30m
        # asks the instance to keep failing across two windows, so one transient blip
        # (a brief target outage cleared on retry 1) never alerts.
        expr: increase(lazyview_refresh_errors_total[30m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "lazyview instance {{ $labels.job }} in {{ $labels.namespace }} keeps failing refreshes ({{ $value }} in the last 30 m)."
      - alert: LazyviewViewBehindSource
        # "This view is N seconds behind the source" (review O-01): the gauge is the source's
        # own clock on both sides (src/engine.rs, SourceClock::lag — a clock the engine measures
        # at connect and at every housekeeping tick), so it reads 0 while a caught-up view sits
        # idle and grows with the real age of a backlog. The instance's other age metric,
        # lazyview_applied_position_age_seconds, also grows while the source is idle and so
        # stays a diagnostic only: this is the one to alert on. The guard keeps the states
        # LazyviewDown / LazyviewNotScraped / LazyviewNotStreaming own off this rule: here the
        # stream is running and only the view is late. 300 s is the shipped default, a
        # per-deployment setting, not a code constant (owner 2026-11-16): a deployment whose
        # refresh cadence is normally slower overrides it under prometheus.rules.groups with the
        # engine's own cadence knobs (LAZYVIEW_BATCH_WINDOW_MS, LAZYVIEW_HEARTBEAT_MS). `for: 10m`
        # asks the view to stay behind across several flushes, so one big transaction being
        # applied does not alert (the number falls back to 0 the moment the view has applied
        # everything the reader has seen).
        expr: max by (namespace, job, view) (lazyview_view_source_lag_seconds) > 300 and on (namespace, job) (max by (namespace, job) (lazyview_streaming) == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "View {{ $labels.view }} of {{ $labels.job }} in {{ $labels.namespace }} is {{ $value }} s behind the source while the stream runs."
          description: "The view has not applied what the reader has read for that long; 0 means caught up. Which stall state it is: lazyview_view_refresh_failures (a refresh that fails on every attempt — see LazyviewRefreshFailing), lazyview_binlog_backpressure_total (binlog reading held by a build — see LazyviewBinlogReadingPaused), lazyview_stream_reconnect_undecodable_total (the reader stuck on one event — see LazyviewStreamUndecodable). SELECT name, target, state, last_error, refreshed_at FROM _lazyview_state WHERE CONCAT('<schema>.', name) = '{{ $labels.view }}' (the label is schema.view)"
      - alert: LazyviewBinlogReadingPaused
        # The "paused reader": binlog reading is held while the changes buffered for building
        # views sit past their byte budget (src/engine.rs `hold_for_builds`), so the source keeps
        # writing and nothing is read. The budget is `MemoryBudget::build_hold_bytes`
        # (src/mem.rs), derived from the memory the pod is given, so the knob this threshold
        # mirrors is this release's own `resources.limits.memory` value (raise it, or accept a
        # longer hold). Holding is normal while a view builds its first
        # version — `for: 30m` therefore asks the holds to keep appearing across two 30 m
        # windows, not one blip — and while it holds, lazyview_view_source_lag_seconds is what
        # makes the wait visible instead of green.
        expr: increase(lazyview_binlog_backpressure_total[30m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "lazyview instance {{ $labels.job }} in {{ $labels.namespace }} keeps pausing binlog reading ({{ $value }} holds in the last 30 m): a building view's changes exceed their budget."
          description: "Look for 'changes buffered for building views exceed their budget; binlog reading paused until a build is applied' (names the buffered MiB) and 'binlog reading resumed' (names how long each hold lasted); lazyview_view_builds_total and lazyview_view_whole_view_refreshes_total say which view is building"
      - alert: LazyviewBinlogReadingStuck
        # Same counter, 2 h: a build that never gets applied (its swap keeps losing the table
        # lock, a build wedged on a source that never answers) holds the reader for good, and
        # then every view of the instance falls behind while /livez stays green — the hold loop
        # keeps beating and runs housekeeping on purpose (src/engine.rs `hold_for_builds`), so
        # nothing but this counter says so.
        expr: increase(lazyview_binlog_backpressure_total[30m]) > 0
        for: 2h
        labels:
          severity: critical
        annotations:
          summary: "lazyview instance {{ $labels.job }} in {{ $labels.namespace }} has been pausing binlog reading for 2 h: a build is not being applied."
          description: "The reader is held until a build is applied; nothing is read meanwhile. SELECT name, target, state, refreshed_at FROM _lazyview_state (a version stuck in 'building'), and the 'binlog reading paused' WARN lines for the MiB held"
      - alert: LazyviewTargetBehind
        # A target that is behind keeps the changes it owes (they are never dropped and the view
        # is never rebuilt for them — owner rule); once the keys kept for it pass their byte
        # budget the engine reports the crossing once, in the WARN line and in
        # `lag_over_budget` (src/engine.rs `report_lag_over_budget`, budget
        # `MemoryBudget::lag_hold_bytes` of src/mem.rs, again derived from the pod's memory). The
        # state is harmless for a minute and an alarm for an hour: the kept changes are memory,
        # and the target's rows are stale the whole time. `for: 30m` matches the 30 m window (the
        # ladder of target retries reaches its 30 s cap inside it), so a target that answers on
        # the second or third try never alerts.
        expr: increase(lazyview_lag_over_budget_total[30m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "A target of lazyview instance {{ $labels.job }} in {{ $labels.namespace }} has been behind its byte budget for the last 30 m ({{ $value }} crossings)."
          description: "The WARN line names the view and the target ('the changes kept for this target exceed their N byte budget'); the target is retried with backoff and catches up from the changes kept for it, never by a rebuild. SELECT name, target, state, last_error FROM _lazyview_state WHERE state = 'error'"
      - alert: LazyviewViewMetricAbsent
        # A view that stopped publishing statistics is itself a stall state: every per-view rule
        # above reads a series that is no longer there. This is absent() per namespace and job
        # rather than the bare absent(): one deployment must not hide another's silence, and an
        # instance that genuinely has no view definitions publishes no per-view series at all and
        # must not alert (hence the `lazyview_views > 0` side, from the same scrape). An
        # instance that publishes nothing at all is LazyviewDown / LazyviewNotScraped.
        expr: max by (namespace, job) (lazyview_views) > 0 unless on (namespace, job) (count by (namespace, job) (lazyview_view_source_lag_seconds) > 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "lazyview instance {{ $labels.job }} in {{ $labels.namespace }} has {{ $value }} view(s) but publishes no per-view freshness series: the view alerts above are blind."
          description: "lazyview_views comes from the scrape while no lazyview_view_source_lag_seconds series does, so the statistics task is not publishing (check the pod's log for the stats aggregator and lazyview_stats_batches_dropped_total in the same scrape)"
      - alert: LazyviewStreamUndecodable
        # The reader stuck on one event (review A-02): an event whose payload cannot be decoded
        # or mapped ends the round, and the round re-reads it from the saved boundary on the
        # connect ladder (1 s doubling to 30 s, src/engine.rs `stream_pause`), so the position
        # stops moving while /livez stays green (the loop is alive: it is the event that is not).
        # `> 3` in 5 m is the shape of that ladder — more than three rounds means the same event
        # has beaten the backoff at least twice, which no transient decode failure does (a
        # server does not refuse bytes it has just written; the ERROR line names the event's
        # kind, table and position once per position). The counter never means a change was
        # dropped: the reader re-reads from the boundary.
        expr: increase(lazyview_stream_reconnect_undecodable_total[5m]) > 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "lazyview instance {{ $labels.job }} in {{ $labels.namespace }} has been reconnecting onto an undecodable binlog event ({{ $value }} rounds in the last 5 m): the applied position is pinned."
          description: "The ERROR line 'binlog event cannot be decoded' names the kind, table and position once per position; lazyview_applied_position_age_seconds stays above 0 while this rises. Fix the decoder or the event — there is no skip control (see the plan's open question)"
