# Example only (placeholder values). Prefer creating it out of band and removing this file:
#   kubectl -n lazyview create secret generic lazyview-db \
#     --from-literal=LAZYVIEW_HOST=db.example.com --from-literal=LAZYVIEW_USER=lazyview \
#     --from-literal=LAZYVIEW_PASSWORD='change-me' --from-literal=LAZYVIEW_DATABASE=app
# Values are used verbatim (no URL encoding). LAZYVIEW_DSN=mysql://user:pass@host:3306/db works
# instead of the separate keys; other targets: LAZYVIEW_TARGET_<NAME>_HOST/_USER/_PASSWORD/
# _DATABASE (or _DSN) plus LAZYVIEW_TARGETS. The Secret is read at container start: run
# `kubectl -n lazyview rollout restart deployment/lazyview` after changing it.
apiVersion: v1
kind: Secret
metadata:
  name: lazyview-db
  labels:
    app.kubernetes.io/name: lazyview
    app.kubernetes.io/instance: lazyview
type: Opaque
stringData:
  LAZYVIEW_HOST: db.example.com
  LAZYVIEW_PORT: "3306"
  LAZYVIEW_USER: lazyview
  LAZYVIEW_PASSWORD: change-me
  LAZYVIEW_DATABASE: app
  # LAZYVIEW_TLS: verify-full
