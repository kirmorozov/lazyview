name: ci

# What runs when (owner, 2026-11-26, after measuring the integration matrix at 807 of the 818
# runner-minutes of a main run -- "7 hours per pr? that is stupidity", "2 hours for ci still too
# much", "we need to solve ci/cd congestion cycle and tests wall clock time"):
#   DRAFT pull_request  -> only the fast jobs: lint, unit, deny, features. No build, no container,
#                          no server. Workers push WIP at least every 60 min (host rule); 30 such
#                          runs in 24 h were filling the runners and queueing main's own run.
#   pull_request        -> the fast jobs plus every heavy job ON THE 3-FLAVOR SET (below): marking
#                          a PR ready (ready_for_review, in `on:`) is what starts the full run.
#   push (main, v*), workflow_dispatch -> everything, on the FULL matrix: every landed commit
#                          therefore shows its own full matrix, and a release tag pays for all of it.
# The jobs: lint, unit,
# e2e, deny (cargo-deny advisories + licenses), features (the optional cargo features built and
# tested; their clippy runs sit in `lint`), scan-image (trivy), the integration matrix,
# integration-multi, integration-pg (PostgreSQL
# as a TARGET: every supported major, on the baseline source mysql84), integration-pg-multi (the same
# target grid the other way round: every MySQL-family source on the baseline target pg16) and
# integration-pgsrc (PostgreSQL as a SOURCE, every major). The integration matrix runs ONE build
# (`build-tests`, once) and then only RUN jobs -- (server group x binary shard) cells that download
# the binaries from the build artifact, start their servers and execute their shard (owner
# 2026-11-26: "build once, fan out the runs ... make sure we efficient on code"); the matrix is
# 18 cells on a push (<= the runner concurrency, so a run never queues behind itself) and 9 on a
# PR. A flavor that goes red on main after a landing is reverted or fixed forward the SAME DAY.
# The network-chaos suite (tests/chaos.rs) runs only in the two shard-A chaos jobs (mysql84 and
# mariadb114 -- the flavors whose `run: "chaos"` matrix entries start
# the toxiproxy daemon: the job's own server family reached through it (compose profile `chaos`), its
# scenarios required (scripts/chaos-gate.sh fails the step on any failure tests/chaos-known-red.txt
# does not list, and prints the listed ones in the job summary), the toxi self-tests required. The
# plain integration suites of those jobs are gated by the same script, on
# tests/integration-known-red.txt: an unlisted failure fails the step, a listed one still runs,
# passes the step and shows in the job summary with its issue. Every entry there is temporary,
# owner-approved, and deleted by the PR that fixes its issue.
# The chaos_tgt_pg_ scenarios run once, where the PostgreSQL target sits next to a daemon:
# integration-pg
# (integration-pg-multi pins that target and rotates the sources, so the faults are not paid for
# twice; its legs are the targets_pg_ gates).
# The soak jobs (bottom of the file) are the two bounded soaks: `soak-pr`, a bounded 5-minute smoke
# on mysql84, runs on every pull_request (a check of its own, so its log shows soak_smoke_30m
# passing for real); `soak-smoke` (30 minutes, mysql84 + mariadb1011) runs only for the nightly and
# a manual run, and `report` opens or updates the one open issue labelled `nightly` after a failed
# nightly. The nightly is nightly.yml calling this workflow on the schedule: the schedule event then
# runs the soak jobs only (every regular job skips), because a push to main has already run the
# full set on this very commit (#236) and the nightly adds only what that push does not run. The
# long soak (tests/soak.rs `soak_long`) is not a CI job: GitHub Actions have time limits, so it
# runs locally as a release gate through the repo's own runner, scripts/soak.sh: `scripts/soak.sh
# long [hours]` (its `smoke [flavor]` is the same 30-minute smoke, run by hand). That runner
# is PR #363; it has since landed (scripts/soak.sh is on main), so the gate runs from the repo,
# not from a scratch dir.
# twice; its legs are the targets_pg_ gates). The jobs that gate image/release (the supply-chain scans,
# deny + scan-image, and the optional features) are not advisory (S-09): an advisory job gates nothing.
# Images are published to ghcr.io/kirmorozov/lazyview only for pushes:
#   main  -> `image`   (needs lint + unit + e2e; the integration jobs run alongside, not required)
#   v*    -> `release` (needs lint + unit + e2e + the integration matrix + the multi-server job +
#                       the supply-chain gate: deny + scan-image + features; the matrix's 12 blocking
#                       servers must pass, its 2 advisory pre-release entries run with
#                       continue-on-error and cannot block it)
# Pull requests never get registry credentials and never push.
# The one exception, and the only path filter in this file (#369): a pull_request whose every changed file
# is documentation starts NO run here (paths below). Owner, 2026-11-23: "doc only prs can be
# bundled and merged without test runs" -- the keeper's landing pass lands such a PR on its guard PASS
# without waiting for CI (tmp/lvs-land-ready.sh), so a run here would only spend a runner on prose.
# One truth, one filter: a PR that changes ONLY `docs/**`, or a markdown file outside `.claude/` and
# `.github/`, starts no run; a PR that changes anything under `.claude/` or `.github/` -- markdown
# included, `.claude/agents/generic-guard.md` included -- runs the full set. `**` takes every changed
# path, the two `!` patterns after it take prose back out, and the two positive patterns after those put
# the config trees back in: the LAST pattern a path matches decides it, so a negative pattern after a
# positive one excludes and a positive one after a negative re-includes. The filter before #369 was the
# ignore-list form of these same two prose patterns, and GitHub excludes a path that matches ANY ignore
# pattern even when a positive one matches it too -- so the guard's own definition, an executable policy
# artifact, started no run at all and tmp/lvs-land-ready.sh refused it twice: its docs_only() rejects
# anything matching `^(src|tests)/|^\.` so it is not docs-only, and its normal path skips a PR whose
# non-excluded checks are `0 not green of 0`. Config is not prose: the guard definition, the workflows and
# the pinned actions are what CI and the keeper's landing pass actually execute, so an edit to them is
# verified like code. A PR that changes a doc alongside anything else runs the full set exactly as it does
# today.
# `push` (main, v*) and `workflow_dispatch` keep NO filter on purpose -- every landed commit shows its own
# full matrix, and a manual run is asked for.
# ci.yml is the only workflow that triggers on pull_request (the others run on schedule,
# workflow_dispatch or workflow_call), so a docs-only PR starts no Actions run at all.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # ready_for_review (owner 2026-11-26): a DRAFT PR runs only the fast jobs (see the header), so
    # marking it ready is what starts the heavy set -- without this type the full run would only
    # arrive on the next push to the branch.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - ".claude/**"
      - ".github/**"
  workflow_dispatch:
  # Called by nightly.yml (the nightly on main HEAD). Its caller's event is `schedule`, so every
  # regular job skips and only the soak jobs and report run; workflow_call is listed alongside
  # schedule in those `if`s so the split holds whichever event name the called workflow sees.
  workflow_call:

# A newer run for the same ref and event cancels the superseded one, except on main, where
# cancel-in-progress stays false: a running main verification is never cancelled. On main the
# group is per BRANCH, not per sha (2026-11-23: 3 main runs queued behind each other for 4 h —
# sha-keyed groups gave every push its own group, so a queued run was never replaced): a newer
# pending push replaces an older pending one inside the group, so the queue holds at most one
# running and one pending main run, and the newest commit is always verified. Pull-request
# behaviour is unchanged (a group per PR ref, a newer push to the PR cancels the older run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.ref_name || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Keep in step with the rust image in the Dockerfile.
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: lint (fmt + clippy)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_call'  # the nightly runs only the soak jobs
    runs-on: ubuntu-24.04
    # 30, not 20: the two feature clippy runs build their own dependency trees on a cache miss,
    # and the aws-secrets one (aws-config / aws-sdk-secretsmanager and the smithy stack) is large.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo clippy (feature roaring)
        run: cargo clippy --locked --all-targets --features roaring -- -D warnings
      - name: cargo clippy (feature aws-secrets)
        # The `aws-secret://` tree (src/secrets.rs `mod aws` and the cfg(feature) cases in
        # src/secrets/tests.rs) is compiled under no linter without this step: the aws-*
        # dependencies are built only by the `features` job, which runs `cargo test`, so a lint
        # escape in the feature's code could never fail a run (and `cargo build` alone would not
        # see the cfg(test) cases at all). Same command as the roaring step above; the feature's
        # build and unit tests stay in `features` (S-09).
        run: cargo clippy --locked --all-targets --features aws-secrets -- -D warnings

  unit:
    name: unit tests
    if: github.event_name != 'schedule' && github.event_name != 'workflow_call'  # the nightly runs only the soak jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test --lib --bins
        run: cargo test --locked --lib --bins
      - name: lib tests (feature roaring)
        run: cargo test --locked --lib --features roaring

  deny:
    name: "supply-chain (cargo-deny: advisories + licenses)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Pinned supply-chain tools: exact version + sha256, never a floating tag.
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install pinned cargo-deny
        run: |
          curl -fsSLo cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz
          "./cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" --version
      - name: cargo-deny check advisories licenses
        # deny.toml (auto-discovered) scans the whole lockfile with all features
        # and triages the advisories upstream pins us onto, each with a reason.
        # Required by `release` (S-09); a vulnerable or unexpectedly-licensed
        # dependency fails the job, so nothing here is advisory.
        run: ./cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny check advisories licenses

  features:
    name: optional features (${{ matrix.features }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Every non-default feature in Cargo.toml gets one entry (S-09: the
        # optional features are the untested part of the lockfile). A new feature
        # here needs a matching `cargo clippy (feature …)` step in `lint`: this job
        # builds and tests, that one lints.
        features: [roaring, aws-secrets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test --lib --bins (feature ${{ matrix.features }})
        # Builds the feature's dependency tree (the aws tree only ever compiles
        # here) and runs the unit tests against it. Required by `release`.
        run: cargo test --locked --lib --bins --features "${{ matrix.features }}"

  build-tests:
    # "Build once, fan out the runs" (owner 2026-11-26: "fan out via docker or with github actions
    # ci/cd and make sure we efficient on code"). This job compiles the engine binary, the lib tests
    # and EVERY integration-suite binary (tests/*.rs) exactly once, and hands them to the run jobs
    # as one artifact: ci-bins/ holds the executables plus ci-manifest.tsv (TAB-separated
    # "<suite name>\t<executable path>"). No run job compiles anything -- they download the artifact
    # and exec the binaries through scripts/ci-run-binaries.sh (no rustup, no rust-cache restore,
    # no cargo in those jobs at all). Draft PRs run no heavy job, so this job is also the cut that
    # makes a draft cheap. On a cache miss the build is ~10-15 min (it was paid inside every matrix
    # job before); on a hit ~1-2 min + upload.
    name: build test binaries
    if: github.event_name != 'schedule' && github.event_name != 'workflow_call' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)  # the nightly runs only the soak jobs; a draft PR runs only the fast jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: integration
          # The ONE writer of the shared cache (the run jobs never compile; soak-smoke, the only job
          # that still builds its own binary, reads this cache on the nightly).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: build the engine, the lib tests and every integration suite
        run: |
          cargo build --locked --bins
          cargo test --locked --no-run --message-format=json > build.json
          mkdir -p ci-bins/deps
          # One manifest line per suite: "<name>\t<exe>", relative paths. kind ["test"] = a tests/*.rs
          # binary (its target name is the file stem); kind ["lib"] with profile.test = the lib tests,
          # named "lib". Plain lib/bin builds (profile.test false) are the cargo cache, not suites.
          jq -r 'select(.reason == "compiler-artifact" and .executable != null and .profile.test == true)
                 | [(if .target.kind == ["lib"] then "lib" else .target.name end), .executable] | @tsv' \
            build.json | sort -u -k1,1 > ci-bins/ci-manifest.tsv
          while IFS=$'\t' read -r name exe; do
            [ -n "$name" ] || continue
            cp "$exe" "ci-bins/deps/$(basename "$exe")"
            printf '%s\t%s\n' "$name" "ci-bins/deps/$(basename "$exe")"
          done < ci-bins/ci-manifest.tsv > ci-bins/ci-manifest.new
          mv ci-bins/ci-manifest.new ci-bins/ci-manifest.tsv
          # An empty manifest here would turn into 18 confusing "suite not in manifest" errors in
          # the run jobs; fail at the source instead.
          [ -s ci-bins/ci-manifest.tsv ] || { echo "::error::ci-manifest.tsv is empty: the jq above matched no compiler-artifact in build.json (first lines):"; head -5 build.json; exit 1; }
          # The engine the harness spawns (tests/common/engineproc.rs engine_binary(): no cargo in the
          # run jobs, so they name it with LAZYVIEW_TEST_ENGINE_BIN, which points here).
          cp target/debug/lazyview ci-bins/lazyview
          echo "manifest:"; column -t -s $'\t' ci-bins/ci-manifest.tsv
      - name: upload the test binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-bins
          path: |
            ci-bins/
          retention-days: 1
          if-no-files-found: error

  integration:
    # The matrix is (server group x binary shard) (owner 2026-11-26: "build once, fan out the
    # runs"): every cell is one runner that downloads the binaries from `build-tests`, starts its
    # server group (here one server -- a flavor of docker-compose.test.yml, docs/server-setup.md
    # "Supported servers") and runs its shard's suites against it. No run job compiles anything.
    # The SHARDS, balanced by the measured per-binary times of main run 45702946384 / mysql84
    # (49.3 min of test time across 30 result lines from 28 test binaries:
    # tmp/out/lvsuper/ci-time/mysql84.log -- health 12.5, regressions 10.3, chaos 7.3,
    # migration 5.1, rename_invariance 3.6, bench_throughput 2.0, exclusive 2.0, supervisor 1.7,
    # the other binaries under 1 min each):
    #   run: "all"  -- every server-sensitive suite on this flavor (everything except health,
    #                 bench_throughput, supervisor and the chaos binary): ~26 min. Main's set.
    #   run: "b1"   -- regressions + rename_invariance (~14 min), run: "b2" -- migration, exclusive
    #                 and the other 20 small binaries (~12 min): the same suites split in two, what
    #                 a PR runs so no PR job pays the whole 26 min (owner: PR about 20 min wall).
    #   run: "si"   -- the server-independent suites (health, bench_throughput, supervisor): they do
    #                 not read the server dialect, so ONE job on mysql84 runs them for the whole set
    #                 instead of every flavor paying its own 16 measured minutes of them.
    #   run: "chaos"-- the chaos binary (self-tests + scenarios) on mysql84 and mariadb114 only --
    #                 the faults arm the link between the harness and THIS job's server, so two
    #                 flavors (one per product, both in the PR set) cover it without 15 x 7.3 min.
    #                 These two cells are the only jobs that start the toxiproxy daemon.
    # Every other suite is server-sensitive (binlog, DDL, charset, GTID, cursor) and runs on EVERY
    # flavor of the event's set, so on main every flavor stays blocking for everything
    # server-specific; a flavor that goes red on main after a landing is reverted or fixed forward
    # the same day. The SET of flavors depends on the event (owner 2026-11-26: "7 hours per pr?
    # that is stupidity"): a pull_request runs exactly 3 flavors -- mysql84 (the oldest supported
    # MySQL LTS), mysql97 (the newest MySQL) and mariadb114 (the newest MariaDB LTS) -- 9 cells
    # (b1/b2 per flavor + si + the two chaos cells); every other event -- the push to main and the
    # v* tags, and workflow_dispatch -- runs the full list: the 12 blocking servers (every
    # supported LTS line, the latest GA of each product, the two AWS-only lines), the
    # supervisor:"off" sequential-refresh entry and the 2 advisory pre-releases = 18 cells, at or
    # under the runner concurrency so a run never queues behind itself. The tier and the shard are
    # in the job title, so a check reads e.g. "integration (mysql84, LTS, shard B1)".
    name: integration (${{ matrix.flavor }}, ${{ matrix.tier }}, shard ${{ matrix.shard }}${{ matrix.run == 'chaos' && ', chaos' || '' }}${{ matrix.supervisor && format(', supervisor {0}', matrix.supervisor) || '' }}${{ matrix.advisory && ', advisory' || '' }})
    if: github.event_name != 'schedule' && github.event_name != 'workflow_call' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)  # the nightly runs only the soak jobs; a draft PR runs only the fast jobs
    needs: build-tests
    runs-on: ubuntu-24.04
    # Server + (for the chaos cells) toxiproxy start/wait, the artifact download and the suites
    # (worst cell: ~26 min of measured test time). No compile: build-tests did that once.
    timeout-minutes: 90
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        # Service names and host ports from docker-compose.test.yml. The AWS-only flavors are
        # community-EOL but still run by Amazon RDS / Aurora (drop one = its entry here + its service
        # in docker-compose.test.yml). The supervisor:"off" entry is the sequential refresh path
        # (LAZYVIEW_SUPERVISOR=off); the other jobs run the default (concurrent) one. The advisory
        # pre-releases (compose profile `prerelease`) are tested, not supported, never required.
        # One expression, two sets (the header above says which event runs which, and why): a
        # pull_request takes the 3-flavor list, every other event the full one, byte for byte the
        # flavors main ran before -- each flavor's fields (port, tier, advisory, supervisor) are
        # exactly as they were. `shard` labels the job title; `run` picks the shard's binaries.
        include: >-
          ${{ fromJSON(
          github.event_name == 'pull_request'
          && '[{"flavor":"mysql84","port":33084,"tier":"LTS","advisory":false,"shard":"A","run":"si"},{"flavor":"mysql84","port":33084,"tier":"LTS","advisory":false,"shard":"A","run":"chaos"},{"flavor":"mysql84","port":33084,"tier":"LTS","advisory":false,"shard":"B1","run":"b1"},{"flavor":"mysql84","port":33084,"tier":"LTS","advisory":false,"shard":"B2","run":"b2"},{"flavor":"mysql97","port":33097,"tier":"LTS","advisory":false,"shard":"B1","run":"b1"},{"flavor":"mysql97","port":33097,"tier":"LTS","advisory":false,"shard":"B2","run":"b2"},{"flavor":"mariadb114","port":33114,"tier":"LTS","advisory":false,"shard":"A","run":"chaos"},{"flavor":"mariadb114","port":33114,"tier":"LTS","advisory":false,"shard":"B1","run":"b1"},{"flavor":"mariadb114","port":33114,"tier":"LTS","advisory":false,"shard":"B2","run":"b2"}]'
          || '[{"flavor":"mysql84","port":33084,"tier":"LTS","advisory":false,"shard":"B","run":"all"},{"flavor":"mysql97","port":33097,"tier":"LTS","advisory":false,"shard":"B","run":"all"},{"flavor":"mysql2610","port":33261,"tier":"GA","advisory":false,"shard":"B","run":"all"},{"flavor":"mysql80","port":33080,"tier":"AWS-only","advisory":false,"shard":"B","run":"all"},{"flavor":"percona84","port":33184,"tier":"LTS","advisory":false,"shard":"B","run":"all"},{"flavor":"percona97","port":33197,"tier":"LTS","advisory":false,"shard":"B","run":"all"},{"flavor":"mariadb1011","port":33111,"tier":"LTS","advisory":false,"shard":"B","run":"all"},{"flavor":"mariadb114","port":33114,"tier":"LTS","advisory":false,"shard":"B","run":"all"},{"flavor":"mariadb118","port":33118,"tier":"LTS","advisory":false,"shard":"B","run":"all"},{"flavor":"mariadb123","port":33123,"tier":"LTS","advisory":false,"shard":"B","run":"all"},{"flavor":"mariadb130","port":33130,"tier":"GA","advisory":false,"shard":"B","run":"all"},{"flavor":"mariadb106","port":33106,"tier":"AWS-only","advisory":false,"shard":"B","run":"all"},{"flavor":"mariadb1011","port":33111,"tier":"LTS","advisory":false,"supervisor":"off","shard":"B","run":"all"},{"flavor":"mariadb131-rc","port":33131,"tier":"pre-release","advisory":true,"shard":"B","run":"all"},{"flavor":"mariadb132-pre","port":33132,"tier":"pre-release","advisory":true,"shard":"B","run":"all"},{"flavor":"mysql84","port":33084,"tier":"LTS","advisory":false,"shard":"A","run":"si"},{"flavor":"mysql84","port":33084,"tier":"LTS","advisory":false,"shard":"A","run":"chaos"},{"flavor":"mariadb114","port":33114,"tier":"LTS","advisory":false,"shard":"A","run":"chaos"}]'
          ) }}
    env:
      COMPOSE_FILE: docker-compose.test.yml
      # `prerelease` unlocks the pre-release flavors, `chaos` the toxiproxy service the two
      # run:"chaos" cells start by name (the image is pinned in docker-compose.test.yml).
      COMPOSE_PROFILES: prerelease,chaos
      FLAVOR: ${{ matrix.flavor }}
      # The engine the harness spawns (tests/common/engineproc.rs): these jobs hold no cargo, so the
      # binary comes from the build-tests artifact named here.
      LAZYVIEW_TEST_ENGINE_BIN: ci-bins/lazyview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: get the test binaries (built once by build-tests)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-bins
          path: ci-bins
      - run: chmod +x ci-bins/deps/* ci-bins/lazyview
      - name: start ${{ matrix.flavor }}${{ matrix.run == 'chaos' && ' + toxiproxy' || '' }} (in the background)
        run: docker compose up -d --quiet-pull "$FLAVOR"${{ matrix.run == 'chaos' && ' toxiproxy' || '' }}
      - name: wait for ${{ matrix.flavor }}${{ matrix.run == 'chaos' && ' + toxiproxy' || '' }}
        run: docker compose up -d --wait --wait-timeout 300 "$FLAVOR"${{ matrix.run == 'chaos' && ' toxiproxy' || '' }}
      - name: server version${{ matrix.run == 'chaos' && ' + toxiproxy' || '' }}
        run: |
          docker compose exec -T "$FLAVOR" sh -c 'exec "$(command -v mariadb || command -v mysql)" --protocol=TCP -h127.0.0.1 -ulv -plv -NB -e "SELECT VERSION()"'
          ${{ matrix.run == 'chaos' && 'curl -fsS http://127.0.0.1:18474/version' || 'echo "no toxiproxy on this cell (chaos runs on mysql84 and mariadb114 only)"' }}
      - name: integration tests (shard ${{ matrix.shard }})
        if: matrix.run != 'chaos'
        timeout-minutes: 45
        env:
          LAZYVIEW_TEST_DSNS: ${{ matrix.flavor }}=mysql://lv:lv@127.0.0.1:${{ matrix.port }}/lvtest
          # Strict: the MySQL-family target tests must run for real on this one server, never skip.
          # The targets_pg_* tests need a PostgreSQL server this job does not have: they are skipped
          # below and run in the postgres-target job only.
          LAZYVIEW_TEST_STRICT: "targets_,visibility_"
          LAZYVIEW_HEALTH_ADDR: "off"
          # Suites run one binary at a time here, so the DST test may change GLOBAL time_zone and
          # the MariaDB refusal test GLOBAL log_bin_compress.
          LAZYVIEW_TEST_GLOBAL_TZ: "1"
          LAZYVIEW_TEST_GLOBAL_BINLOG_COMPRESS: "1"
          # visibility.rs sets GLOBAL sync_binlog, binlog_group_commit_sync_delay and binlog_order_commits (one binary at a time).
          LAZYVIEW_TEST_GLOBAL_BINLOG_COMMIT: "1"
          # One binary at a time here too, so the SQL_MODE regression may change GLOBAL sql_mode (S12).
          LAZYVIEW_TEST_GLOBAL_SQL_MODE: "1"
          # One server per job: the purge regression may purge its binlogs.
          LAZYVIEW_TEST_PURGE_BINLOGS: "1"
          # One server here: the multi-server scenarios skip (visibly) instead of failing, which
          # the harness does by default when CI is set; integration-multi runs them.
          LAZYVIEW_TEST_REQUIRE_MULTI: "0"
          # Every engine runs as the account with only the grants of docs/server-setup.md (the RDS /
          # Aurora privilege model); setup and oracle queries stay on the admin account.
          LAZYVIEW_TEST_ENGINE_USER: lvdoc:doc
          # Empty: the default mode. The harness passes it to every engine a test starts.
          LAZYVIEW_SUPERVISOR: ${{ matrix.supervisor || '' }}
          # The exclusive suite (server restarts, killed connections, idle binlog rotation) restarts this job's own disposable server; compose names the container <project>-<service>-1 and the project is the checkout dir (lazyview).
          LAZYVIEW_TEST_EXCLUSIVE: ${{ matrix.flavor }}=lazyview-${{ matrix.flavor }}-1
        # --no-fail-fast semantics: scripts/ci-run-binaries.sh runs EVERY named binary even when
        # one fails, one binary at a time (what the GLOBAL-mutation suites require, as before), and
        # a failing binary fails the step. The shard picks the binaries by the measured times
        # (the matrix comment above): "all" = every server-sensitive suite (main's cell: enumerate
        # tests/*.rs so a NEW suite joins automatically, the way --test '*' used to take every new
        # one; the si suites and the chaos binary are its own cells and are skipped here); "b1" =
        # regressions + rename_invariance; "b2" = the rest (migration, exclusive and the 20 small
        # ones); "si" = health, bench_throughput, supervisor on mysql84 only.
        # The chaos binary (chaos_* scenarios + selftest_toxi_*) runs for real in its own cells and
        # steps below (strict there); filtered out here so it never runs twice.
        # The gate below is scripts/chaos-gate.sh with tests/integration-known-red.txt, used exactly
        # as the chaos steps use it: any failing test this file does not list FAILS the step (a
        # ::error:: per test names the file to fix), and the one listed test
        # (pinned::reg_cascade_refusal_seed_replay, #319) still runs and is reported in the job
        # summary with its issue. No continue-on-error, no skip, no retry; the entry is temporary
        # and owner-approved (2026-11-22) and #319's fix PR deletes it, and with the file empty this
        # step is strict exactly as it stands. The gate's SKIP guard is chaos-specific, so the skip
        # discipline of this step stays what LAZYVIEW_TEST_STRICT above already enforces.
        # --color never: the gate's greps read these lines as plain text. The exit status of the
        # runner (not of tee) is what the gate judges, so a broken run cannot hide behind the pipe.
        run: |
          case "${{ matrix.run }}" in
            si) names=(health bench_throughput supervisor);;
            b1) names=(regressions rename_invariance);;
            all|b2)
              names=()
              for f in tests/*.rs; do
                b=${f#tests/}; b=${b%.rs}
                case " health bench_throughput supervisor chaos " in *" $b "*) continue;; esac
                if [ "${{ matrix.run }}" = b2 ]; then
                  case " regressions rename_invariance " in *" $b "*) continue;; esac
                fi
                names+=("$b")
              done;;
          esac
          set +o pipefail
          scripts/ci-run-binaries.sh ci-bins/ci-manifest.tsv "${names[@]}" -- \
            --test-threads=1 --color never --skip targets_pg_ --skip chaos_ --skip selftest_toxi_ \
            2>&1 | tee integration-tests.log
          scripts/chaos-gate.sh --status "${PIPESTATUS[0]}" --label "$FLAVOR shard ${{ matrix.shard }} integration" \
            integration-tests.log tests/integration-known-red.txt
      # The chaos binary over the toxiproxy daemon (compose profile `chaos`, started above) runs
      # only in the two run:"chaos" cells (mysql84 and mariadb114 -- owner 2026-11-26: the faults
      # arm the link between the harness and THIS job's server, so two flavors, one per product and
      # both in the PR set, cover it; 13 flavors no longer pay 7.3 min for it). The harness arms
      # real network faults between the engines and this job's server. always() so a suite failing
      # above never hides these results; a dead daemon or a lost opt-in env fails loudly instead of
      # skipping, because LAZYVIEW_TEST_STRICT turns every SKIP into a failure.
      - name: toxi self-tests
        if: always() && !cancelled() && matrix.run == 'chaos'
        # The harness's own pins (proxy passthrough, each toxic's effect, daemon restart): not
        # known-red, so this step is required (no continue-on-error).
        timeout-minutes: 10
        env:
          LAZYVIEW_TEST_DSNS: ${{ matrix.flavor }}=mysql://lv:lv@127.0.0.1:${{ matrix.port }}/lvtest
          # The daemon's API and the harness's proxy listen band (compose publishes both on
          # loopback only, no token, lead decision Q5); unset, the suite skips and strict refuses.
          LAZYVIEW_TEST_TOXI: 127.0.0.1:18474
          LAZYVIEW_TEST_STRICT: "chaos_,selftest_toxi_"
          # One server per job: the multi-server scenarios skip (visibly) instead of failing.
          LAZYVIEW_TEST_REQUIRE_MULTI: "0"
          # Every engine runs as the account with only the grants of docs/server-setup.md — through
          # the proxies, which is the point; setup and oracle queries stay on the admin account (Q4).
          LAZYVIEW_TEST_ENGINE_USER: lvdoc:doc
          LAZYVIEW_HEALTH_ADDR: "off"
        run: scripts/ci-run-binaries.sh ci-bins/ci-manifest.tsv chaos -- --test-threads=1 selftest_toxi_
      - name: chaos scenarios
        if: always() && !cancelled() && matrix.run == 'chaos'
        # Required, like the self-tests above: scripts/chaos-gate.sh fails this step on any chaos
        # test that FAILED and is not listed in tests/chaos-known-red.txt, so a NEW chaos failure on
        # either chaos flavor turns this job red (it used to be advisory, and a new failure showed
        # nowhere).
        # A listed failure passes and is written to the job summary with its issue. With that file
        # empty the step is strict exactly as it stands: every chaos failure fails the job, so
        # nothing has to be flipped when the last entry leaves the list.
        # The chaos_tgt_pg_ scenarios are filtered out here: this job has no PostgreSQL server, and
        # strict would refuse their skip. They run for real in the postgres-target job.
        # 9 scenarios x ~120 s worst case + the tee; same bound the separate chaos job used.
        timeout-minutes: 20
        env:
          LAZYVIEW_TEST_DSNS: ${{ matrix.flavor }}=mysql://lv:lv@127.0.0.1:${{ matrix.port }}/lvtest
          LAZYVIEW_TEST_TOXI: 127.0.0.1:18474
          LAZYVIEW_TEST_STRICT: "chaos_,selftest_toxi_"
          LAZYVIEW_TEST_REQUIRE_MULTI: "0"
          LAZYVIEW_TEST_ENGINE_USER: lvdoc:doc
          LAZYVIEW_HEALTH_ADDR: "off"
        # --color never: the gate's greps read these lines as plain text. The exit status of the
        # runner (not of tee) is what the gate judges, so a broken run cannot hide behind the pipe.
        run: |
          set +o pipefail
          scripts/ci-run-binaries.sh ci-bins/ci-manifest.tsv chaos -- \
            --test-threads=1 --color never chaos_ --skip chaos_tgt_pg_ 2>&1 \
            | tee chaos-scenarios.log
          scripts/chaos-gate.sh --status "${PIPESTATUS[0]}" --label "$FLAVOR" chaos-scenarios.log
      - name: advisory flavor failed
        if: failure() && matrix.advisory
        run: |
          echo "::warning title=advisory server failed::${FLAVOR} is a pre-release server (advisory, tested but not supported, not required for a release): see the integration logs"
          echo "### :warning: ${FLAVOR}: advisory pre-release server failed" >> "$GITHUB_STEP_SUMMARY"
          echo "A pre-release server failed the integration suites. It does not block this run; check the logs before the release that moves the latest-GA pin." >> "$GITHUB_STEP_SUMMARY"
      - name: collect server logs
        if: failure()
        run: |
          mkdir -p server-logs
          docker compose logs --no-color --timestamps "$FLAVOR" > "server-logs/${FLAVOR}.log" 2>&1 || true
          docker compose logs --no-color --timestamps toxiproxy > "server-logs/toxiproxy.log" 2>&1 || true
          docker compose ps --all > server-logs/compose-ps.txt 2>&1 || true
      # Server log plus the engine logs the harness keeps for failed tests
      # (tmp/out/test-logs/<schema>/engine-<n>.log).
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The cell's own name: mysql84 and mariadb114 each hold two shard-A cells (the si cell and
          # the chaos cell), so the shard and the run kind are part of the artifact name.
          name: integration-logs-${{ matrix.flavor }}${{ matrix.supervisor && format('-supervisor-{0}', matrix.supervisor) || '' }}-${{ matrix.shard }}${{ matrix.run == 'chaos' && '-chaos' || '' }}
          path: |
            server-logs/
            tmp/out/test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: stop ${{ matrix.flavor }}
        if: always()
        run: docker compose down -v

  integration-multi:
    # The multi-server scenarios (a source replicating into targets on other servers; the
    # single-flavor jobs above skip them): every listed server is the source once, the next
    # ones in the list its targets. Three blocking flavors across the products and versions:
    # MySQL 8.4 LTS, Percona 9.7 and MariaDB 13.0, whose default utf8mb4_uca1400_ai_ci
    # collation the MySQL targets lack.
    name: integration (multi-server, mysql84 + percona97 + mariadb130)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_call' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)  # the nightly runs only the soak jobs; a draft PR runs only the fast jobs
    needs: build-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_FILE: docker-compose.test.yml
      SERVICES: mysql84 percona97 mariadb130
      LAZYVIEW_TEST_ENGINE_BIN: ci-bins/lazyview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: get the test binaries (built once by build-tests)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-bins
          path: ci-bins
      - run: chmod +x ci-bins/deps/* ci-bins/lazyview
      - name: start the servers (in the background)
        run: |
          read -ra services <<<"$SERVICES"
          docker compose up -d --quiet-pull "${services[@]}"
      - name: wait for the servers
        run: |
          read -ra services <<<"$SERVICES"
          docker compose up -d --wait --wait-timeout 300 "${services[@]}"
      - name: server versions
        run: |
          for s in $SERVICES; do
            echo "$s: $(docker compose exec -T "$s" sh -c 'exec "$(command -v mariadb || command -v mysql)" --protocol=TCP -h127.0.0.1 -ulv -plv -NB -e "SELECT VERSION()"')"
          done
      - name: multi-server tests
        timeout-minutes: 45
        env:
          LAZYVIEW_TEST_DSNS: mysql84=mysql://lv:lv@127.0.0.1:33084/lvtest,percona97=mysql://lv:lv@127.0.0.1:33197/lvtest,mariadb130=mysql://lv:lv@127.0.0.1:33130/lvtest
          LAZYVIEW_HEALTH_ADDR: "off"
          # A multi-server scenario that finds too few servers fails here instead of skipping.
          LAZYVIEW_TEST_REQUIRE_MULTI: "1"
        shell: bash
        # Every test of tests/targets.rs plus the regression's multi-target scenario; the four
        # known ones must show up as passed (a rename would otherwise leave this job green
        # without running them).
        run: |
          scripts/ci-run-binaries.sh ci-bins/ci-manifest.tsv targets regressions -- \
            --test-threads=1 --color never targets_ reg_multi_target_with_one_down 2>&1 | tee multi-server-tests.log
          for t in targets_fan_out_and_retarget targets_invalid_configurations_error \
                   targets_one_target_down reg_multi_target_with_one_down; do
            grep -q "^test $t \.\.\. ok$" multi-server-tests.log || { echo "::error::$t did not run and pass"; exit 1; }
          done
      - name: collect server logs
        if: failure()
        run: |
          mkdir -p server-logs
          for s in $SERVICES; do
            docker compose logs --no-color --timestamps "$s" > "server-logs/$s.log" 2>&1 || true
          done
          docker compose ps --all > server-logs/compose-ps.txt 2>&1 || true
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs-multi-server
          path: |
            server-logs/
            tmp/out/test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: stop the servers
        if: always()
        run: docker compose down -v

  integration-pg:
    # A MySQL-family source maintained into PostgreSQL (issue #56): the PostgreSQL TARGET matrix on
    # the baseline source mysql84 — pg14 (AWS-only tier: community EOL 2026-11-12, still run by
    # Amazon RDS, the mysql80/mariadb106 precedent), pg15, pg16 (the supported baseline), pg17 and
    # pg18 (the latest GA) BLOCKING, pg19rc2 ADVISORY (owner's maximum-coverage rule, lead decisions
    # 2026-11-13 and 2026-11-16). Folded into ONE job on one runner, the way integration-pgsrc folds
    # the source majors and integration-multi the flavors: the repo is runner-bound, so the extra
    # majors cost legs, not jobs. Each major runs tests/targets.rs filtered to targets_pg_ — those
    # five gates only, never the whole corpus (the 12-server matrix shows what a fan-out costs) —
    # against its own server on its own host port, with LAZYVIEW_TEST_REQUIRE_PG=1 so no PostgreSQL
    # test may skip. The source is a normal matrix flavor; PostgreSQL is only ever a target here.
    name: integration (postgres target, mysql84 + pg14-pg18 blocking, pg19rc2 advisory)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_call' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)  # the nightly runs only the soak jobs; a draft PR runs only the fast jobs
    needs: build-tests
    runs-on: ubuntu-24.04
    # 5 blocking target legs + the advisory one + the chaos_tgt_pg_ scenarios (3 x ~120 s worst
    # case) + the servers' wait (no compile: the binaries are the build-tests artifact).
    timeout-minutes: 90
    env:
      COMPOSE_FILE: docker-compose.test.yml
      # toxiproxy (compose profile `chaos`) joins the servers: the chaos step below arms real
      # network faults on the link to the PostgreSQL target, the same daemon the matrix jobs use.
      COMPOSE_PROFILES: chaos
      SERVICES: mysql84 pg14 pg15 pg16 pg17 pg18 pg19rc2 toxiproxy
      LAZYVIEW_TEST_ENGINE_BIN: ci-bins/lazyview
    steps:  # identical to integration-multi: start servers (toxiproxy with them, profile `chaos`),
            # wait, print versions, then the targets suite and the chaos_tgt_pg_ scenarios -- all on
            # the build-tests artifact's binaries (this job compiles nothing itself)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: get the test binaries (built once by build-tests)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-bins
          path: ci-bins
      - run: chmod +x ci-bins/deps/* ci-bins/lazyview
      - name: start the servers (in the background)
        run: |
          read -ra services <<<"$SERVICES"
          docker compose up -d --quiet-pull "${services[@]}"
      - name: wait for the servers
        run: |
          read -ra services <<<"$SERVICES"
          docker compose up -d --wait --wait-timeout 300 "${services[@]}"
      - name: server versions
        run: |
          echo "mysql84: $(docker compose exec -T mysql84 sh -c 'exec "$(command -v mariadb || command -v mysql)" --protocol=TCP -h127.0.0.1 -ulv -plv -NB -e "SELECT VERSION()"')"
          for s in pg14 pg15 pg16 pg17 pg18 pg19rc2; do
            echo "$s: $(docker compose exec -T "$s" psql -U lv -d lvtest -Atc 'select version()')"
          done
          # The daemon the chaos step below arms its faults through; a dead one shows here, not at
          # the first scenario.
          curl -fsS http://127.0.0.1:18474/version
      # The blocking majors, one leg per major against its own server. The binary is in the artifact
      # above, so a leg only runs; each leg's five named gates must be seen passing in its own log, and
      # LAZYVIEW_TEST_REQUIRE_PG=1 turns any PG skip into a failure (a major that is not up cannot
      # leave the job green). Ports: pg16 keeps its historic 35432, pg15/pg17/pg18 are the ones
      # integration-pgsrc uses, pg14 35436 and the pre-release 35437 are C2's.
      - name: postgres target tests (pg16 + pg15 + pg17 + pg18 + pg14, blocking)
        env:
          LAZYVIEW_TEST_DSNS: mysql84=mysql://lv:lv@127.0.0.1:33084/lvtest
          LAZYVIEW_HEALTH_ADDR: "off"
          LAZYVIEW_TEST_REQUIRE_PG: "1"
          LAZYVIEW_TEST_REQUIRE_MULTI: "1"
          # No targets_pg_ test may report SKIP here (the rule the matrix's targets_ legs use).
          LAZYVIEW_TEST_STRICT: "targets_pg_"
        run: |
          pgtarget() {
            local name=$1 port=$2 log="pg-target-$1.log"
            LAZYVIEW_TEST_PG_DSNS="$name=postgres://lv:lv@127.0.0.1:$port/lvtest" \
              scripts/ci-run-binaries.sh ci-bins/ci-manifest.tsv targets -- \
              --test-threads=1 --color never targets_pg_ 2>&1 \
              | tee "$log"
            for t in targets_pg_fan_out_and_retarget targets_pg_incremental_never_rebuilds \
                     targets_pg_swap_keeps_readers targets_pg_target_down_does_not_hold_the_others \
                     targets_pg_group_by_unindexable_key; do
              grep -q "^test $t \.\.\. ok$" "$log" \
                || { echo "::error::$name: $t did not run and pass"; exit 1; }
            done
          }
          pgtarget pg16 35432
          pgtarget pg15 35431
          pgtarget pg17 35433
          pgtarget pg18 35434
          pgtarget pg14 35436
      # pg19rc2 is the current pre-release major: the matrix rule's pre-release tier, so it is
      # advisory (continue-on-error) — it annotates the run, never blocks it. When 19.0 ships, move
      # the pin to postgres:19.x and make this a plain `pgtarget pg19 35437` in the step above.
      - name: postgres target tests (pg19rc2, advisory)
        id: pg19
        continue-on-error: true
        env:
          LAZYVIEW_TEST_DSNS: mysql84=mysql://lv:lv@127.0.0.1:33084/lvtest
          LAZYVIEW_TEST_PG_DSNS: pg19rc2=postgres://lv:lv@127.0.0.1:35437/lvtest
          LAZYVIEW_HEALTH_ADDR: "off"
          LAZYVIEW_TEST_REQUIRE_PG: "1"
          LAZYVIEW_TEST_REQUIRE_MULTI: "1"
          LAZYVIEW_TEST_STRICT: "targets_pg_"
        run: |
          scripts/ci-run-binaries.sh ci-bins/ci-manifest.tsv targets -- \
            --test-threads=1 --color never targets_pg_ 2>&1 \
            | tee pg-target-pg19rc2.log
          for t in targets_pg_fan_out_and_retarget targets_pg_incremental_never_rebuilds \
                   targets_pg_swap_keeps_readers targets_pg_target_down_does_not_hold_the_others \
                   targets_pg_group_by_unindexable_key; do
            grep -q "^test $t \.\.\. ok$" pg-target-pg19rc2.log \
              || { echo "::error::pg19rc2: $t did not run and pass"; exit 1; }
          done
      - name: advisory pg19rc2 target failed
        if: steps.pg19.outcome == 'failure'
        run: |
          echo "::warning title=advisory target failed::pg19rc2 is the pre-release PostgreSQL major (advisory, tested but not required for a release): see the pg-target-pg19rc2 log"
          echo "### :warning: pg19rc2: advisory PostgreSQL target leg failed" >> "$GITHUB_STEP_SUMMARY"
          echo "PostgreSQL 19rc2 failed the targets_pg_ scenarios as a target. It does not block this run; check the log before 19.0 ships, when the leg becomes blocking." >> "$GITHUB_STEP_SUMMARY"
      # The chaos_tgt_pg_ scenarios of #242 for real, where the PostgreSQL target actually is: the
      # same faults the matrix jobs arm against their own server, here against pg16 through the
      # toxiproxy daemon started above (the harness proxies pg16:5432 inside the compose network).
      # Strict, so a scenario that cannot reach the daemon or the PG server fails instead of
      # skipping, and required, gated by scripts/chaos-gate.sh on tests/chaos-known-red.txt: these
      # scenarios used to be filtered out of every job that had a server for them and ran nowhere.
      # In the MySQL-family jobs they run nowhere: the chaos binary is excluded from the plain
      # shards (its suites run only in the two run:"chaos" cells) and those cells have no PostgreSQL
      # server, so strict would refuse their skip and every one of them would be red.
      - name: chaos scenarios (postgres target)
        if: always() && !cancelled()
        # 3 scenarios x ~120 s worst case + the tee.
        timeout-minutes: 15
        env:
          LAZYVIEW_TEST_DSNS: mysql84=mysql://lv:lv@127.0.0.1:33084/lvtest
          LAZYVIEW_TEST_PG_DSNS: pg16=postgres://lv:lv@127.0.0.1:35432/lvtest
          LAZYVIEW_HEALTH_ADDR: "off"
          # The PG target must be there (it is: the step above runs the targets suite against it).
          LAZYVIEW_TEST_REQUIRE_PG: "1"
          # One source server here: the multi-server scenarios skip (visibly) instead of failing.
          LAZYVIEW_TEST_REQUIRE_MULTI: "0"
          # The daemon's API and the harness's proxy band (compose publishes both on loopback).
          LAZYVIEW_TEST_TOXI: 127.0.0.1:18474
          LAZYVIEW_TEST_STRICT: "chaos_tgt_pg_"
        # --color never: the gate's greps read these lines as plain text. The exit status of cargo
        # (not of tee) is what the gate judges, so a broken run cannot hide behind the pipe.
        run: |
          set +o pipefail
          scripts/ci-run-binaries.sh ci-bins/ci-manifest.tsv chaos -- \
            --test-threads=1 --color never chaos_tgt_pg_ 2>&1 \
            | tee chaos-pg-target-tests.log
          scripts/chaos-gate.sh --status "${PIPESTATUS[0]}" --label "postgres target" chaos-pg-target-tests.log
      - name: collect server logs
        if: failure()
        run: |
          mkdir -p server-logs
          for s in $SERVICES; do
            docker compose logs --no-color --timestamps "$s" > "server-logs/$s.log" 2>&1 || true
          done
          docker compose ps --all > server-logs/compose-ps.txt 2>&1 || true
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs-pg-server
          path: |
            server-logs/
            tmp/out/test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: stop the servers
        if: always()
        run: docker compose down -v

  integration-pg-multi:
    # The other half of the PostgreSQL target grid (owner, 2026-11-16: "expand postgres
    # source/target matrix"; the review's M-02/M-03 acceptance is "the matrix covers every supported
    # LTS and pre-release"). The job above pins one source (mysql84) and rotates the target major;
    # this one pins the target (pg16, the supported baseline) and rotates the SOURCE: every
    # MySQL-family LTS and AWS-only source — mysql80, mysql84, mysql97, percona84, percona97,
    # mariadb106, mariadb1011, mariadb114, mariadb118, mariadb123 — blocking, and the GA and
    # pre-release sources (mysql2610, mariadb130, mariadb131-rc, mariadb132-pre) as ADVISORY legs.
    # What differs per source family is the point: the type map into PostgreSQL (MySQL's BIT/YEAR/
    # JSON, MariaDB's UUID/INET6, mariadb130's utf8mb4_uca1400_ai_ci collations the MySQL targets
    # lack), the per-flavor binlog reader quirks, and the visibility fence each flavor's snapshot
    # position gives. mysql84 x pg16 therefore appears in both jobs on purpose: it is the grid's
    # baseline pairing, and the leg that shows a failure here is the source's, not the harness's.
    # ONE job on ONE runner with the sources looped inside it, the way integration-multi loops
    # flavors and integration-pg loops target majors: the repo is runner-bound, so these 14 legs cost
    # minutes, not runners (each leg is the same five targets_pg_ gates, ~20 s once the binary comes
    # out of the build-tests artifact; the job's own minutes are quoted in the PR). CI only: no Rust
    # file, no cost per binlog event, no allocation on any hot path, no view ever rebuilt. Each leg
    # keeps LAZYVIEW_TEST_REQUIRE_PG=1 and LAZYVIEW_TEST_STRICT=targets_pg_ — neither the PostgreSQL
    # target nor any targets_pg_ scenario may skip — and the five gates must be seen passing in that
    # leg's own log.
    name: integration (postgres target, mysql-family sources + pg16)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_call' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)  # the nightly runs only the soak jobs; a draft PR runs only the fast jobs
    runs-on: ubuntu-24.04
    # 10 blocking legs + 4 advisory legs + 15 image pulls + the servers' wait (no build: the
    # binaries are the build-tests artifact).
    timeout-minutes: 45
    # The target baseline is proven by integration-pg before the sources are fanned out over it.
    needs: integration-pg
    env:
      COMPOSE_FILE: docker-compose.test.yml
      # `prerelease` unlocks mariadb131-rc and mariadb132-pre, the two pre-release sources (the same
      # profile the integration matrix runs them under). No `chaos`: the chaos_tgt_pg_ scenarios need
      # the toxiproxy daemon and run once, in integration-pg, against this same pg16.
      COMPOSE_PROFILES: prerelease
      LAZYVIEW_TEST_ENGINE_BIN: ci-bins/lazyview
      SERVICES: >-
        pg16
        mysql80 mysql84 mysql97 percona84 percona97
        mariadb106 mariadb1011 mariadb114 mariadb118 mariadb123
        mysql2610 mariadb130 mariadb131-rc mariadb132-pre
    steps:  # integration-pg's step list without the chaos one; the source rotates per leg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: get the test binaries (built once by build-tests)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-bins
          path: ci-bins
      - run: chmod +x ci-bins/deps/* ci-bins/lazyview
      - name: start the servers (in the background)
        run: |
          read -ra services <<<"$SERVICES"
          docker compose up -d --quiet-pull "${services[@]}"
      - name: wait for the servers
        # 15 servers boot side by side on this runner, so the healthchecks get the wider window.
        run: |
          read -ra services <<<"$SERVICES"
          docker compose up -d --wait --wait-timeout 600 "${services[@]}"
      - name: server versions
        run: |
          echo "pg16: $(docker compose exec -T pg16 psql -U lv -d lvtest -Atc 'select version()')"
          for s in mysql80 mysql84 mysql97 percona84 percona97 mariadb106 mariadb1011 mariadb114 \
                   mariadb118 mariadb123 mysql2610 mariadb130 mariadb131-rc mariadb132-pre; do
            echo "$s: $(docker compose exec -T "$s" sh -c 'exec "$(command -v mariadb || command -v mysql)" --protocol=TCP -h127.0.0.1 -ulv -plv -NB -e "SELECT VERSION()"')"
          done
      # The blocking sources, one leg each against the one pg16 server. Ports are the services' own
      # (docker-compose.test.yml): 33080 33084 33097 33184 33197 for the MySQL family and Percona,
      # 33106 33111 33114 33118 33123 for MariaDB, pg16 on its historic 35432.
      - name: postgres target tests (10 MySQL-family sources -> pg16, blocking)
        env:
          LAZYVIEW_TEST_PG_DSNS: pg16=postgres://lv:lv@127.0.0.1:35432/lvtest
          LAZYVIEW_HEALTH_ADDR: "off"
          LAZYVIEW_TEST_REQUIRE_PG: "1"
          # One source server per leg: the multi-server scenarios are filtered out below by the
          # targets_pg_ prefix, so requiring them would only ask for a second server.
          LAZYVIEW_TEST_REQUIRE_MULTI: "1"
          # No targets_pg_ test may report SKIP here (same rule the matrix's targets_ legs use).
          LAZYVIEW_TEST_STRICT: "targets_pg_"
        run: |
          pgsource() {
            local name=$1 port=$2 log="pg-target-$1-to-pg16.log"
            LAZYVIEW_TEST_DSNS="$name=mysql://lv:lv@127.0.0.1:$port/lvtest" \
              scripts/ci-run-binaries.sh ci-bins/ci-manifest.tsv targets -- \
              --test-threads=1 --color never targets_pg_ 2>&1 \
              | tee "$log"
            for t in targets_pg_fan_out_and_retarget targets_pg_incremental_never_rebuilds \
                     targets_pg_swap_keeps_readers targets_pg_target_down_does_not_hold_the_others \
                     targets_pg_group_by_unindexable_key; do
              grep -q "^test $t \.\.\. ok$" "$log" \
                || { echo "::error::$name -> pg16: $t did not run and pass"; exit 1; }
            done
          }
          pgsource mysql80      33080
          pgsource mysql84      33084
          pgsource mysql97      33097
          pgsource percona84    33184
          pgsource percona97    33197
          pgsource mariadb106   33106
          pgsource mariadb1011  33111
          pgsource mariadb114   33114
          pgsource mariadb118   33118
          pgsource mariadb123   33123
      # The GA and pre-release sources, the matrix's advisory tier: continue-on-error, so a failure
      # annotates the run and never blocks it (the same tier these four hold in the integration
      # matrix). When 13.1/13.2 ship GA, move their legs into the step above on the GA pins.
      - name: postgres target tests (mysql2610 + mariadb130 + mariadb131-rc + mariadb132-pre -> pg16, advisory)
        id: pgsrcadv
        continue-on-error: true
        env:
          LAZYVIEW_TEST_PG_DSNS: pg16=postgres://lv:lv@127.0.0.1:35432/lvtest
          LAZYVIEW_HEALTH_ADDR: "off"
          LAZYVIEW_TEST_REQUIRE_PG: "1"
          LAZYVIEW_TEST_REQUIRE_MULTI: "1"
          LAZYVIEW_TEST_STRICT: "targets_pg_"
        run: |
          pgsource() {
            local name=$1 port=$2 log="pg-target-$1-to-pg16.log"
            LAZYVIEW_TEST_DSNS="$name=mysql://lv:lv@127.0.0.1:$port/lvtest" \
              scripts/ci-run-binaries.sh ci-bins/ci-manifest.tsv targets -- \
              --test-threads=1 --color never targets_pg_ 2>&1 \
              | tee "$log"
            for t in targets_pg_fan_out_and_retarget targets_pg_incremental_never_rebuilds \
                     targets_pg_swap_keeps_readers targets_pg_target_down_does_not_hold_the_others \
                     targets_pg_group_by_unindexable_key; do
              grep -q "^test $t \.\.\. ok$" "$log" \
                || { echo "::error::$name -> pg16: $t did not run and pass"; exit 1; }
            done
          }
          pgsource mysql2610      33261
          pgsource mariadb130     33130
          pgsource mariadb131-rc  33131
          pgsource mariadb132-pre 33132
      - name: advisory source legs failed
        if: steps.pgsrcadv.outcome == 'failure'
        run: |
          echo "::warning title=advisory sources failed::mysql2610, mariadb130, mariadb131-rc or mariadb132-pre failed against pg16 (advisory, tested but not required for a release): see the pg-target-*-to-pg16 logs"
          echo "### :warning: advisory MySQL-family sources failed against pg16" >> "$GITHUB_STEP_SUMMARY"
          echo "One of mysql2610, mariadb130, mariadb131-rc, mariadb132-pre failed the targets_pg_ scenarios as a source into PostgreSQL 16. It does not block this run; check the log before the flavor is promoted to the blocking set." >> "$GITHUB_STEP_SUMMARY"
      - name: collect server logs
        if: failure()
        run: |
          mkdir -p server-logs
          for s in $SERVICES; do
            docker compose logs --no-color --timestamps "$s" > "server-logs/$s.log" 2>&1 || true
          done
          docker compose ps --all > server-logs/compose-ps.txt 2>&1 || true
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs-pg-multi-server
          path: |
            server-logs/
            tmp/out/test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: stop the servers
        if: always()
        run: docker compose down -v

  integration-pgsrc:
    # PostgreSQL maintained as a SOURCE (owner ruling "CI follows the source", phase 3). The
    # source-side mirror of the target grid, on the same six image pins integration-pg uses as
    # targets: pg14 (the AWS-only tier) + pg15 + pg16 (the supported baseline) + pg17 + pg18
    # BLOCKING and pg19rc2 ADVISORY (continue-on-error), folded into ONE job on one runner (the repo is
    # runner-bound; like integration-multi, versions are folded into a single job rather than one
    # job per version, so this adds no jobs to the run). The gate has two parts, each required to
    # pass and checked by name so a skip cannot leave the job green: (1) the PG-as-source code
    # landed so far — the Postgres parse profile (S4b, a regression to refusal fails) and the
    # pg_catalog row mapping (#210), the phase-1 named lib tests; (2) the phase-3 logical-replication
    # smoke, tests/pgsrc_replication.rs: it creates the replication slot + publication on the live
    # pin, streams a pgoutput INSERT/UPDATE/DELETE out of the slot and decodes it end to end with
    # the crate's public lazyview::pgoutput decoder, asserting the row images round-trip. Each
    # version runs against its own server via LAZYVIEW_TEST_PG_DSNS + LAZYVIEW_TEST_REQUIRE_PG=1
    # (no pinned test may skip). pg19rc2's smoke step is continue-on-error: a pre-release failure
    # annotates the run but does not block it, exactly like the target matrix's advisory pre-release
    # tier.
    name: integration (postgres source, pg14 + pg15 + pg16 + pg17 + pg18 blocking, pg19rc2 advisory)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_call' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)  # the nightly runs only the soak jobs; a draft PR runs only the fast jobs
    needs: integration-pg
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_FILE: docker-compose.test.yml
      SERVICES: pg14 pg15 pg16 pg17 pg18 pg19rc2
      LAZYVIEW_TEST_ENGINE_BIN: ci-bins/lazyview
    steps:  # identical to integration-pg, on the source side: start servers, download the
            # build-tests artifact (this job compiles nothing), wait, print versions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: get the test binaries (built once by build-tests)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-bins
          path: ci-bins
      - run: chmod +x ci-bins/deps/* ci-bins/lazyview
      - name: start the servers (in the background)
        run: |
          read -ra services <<<"$SERVICES"
          docker compose up -d --quiet-pull "${services[@]}"
      - name: wait for the servers
        run: |
          read -ra services <<<"$SERVICES"
          docker compose up -d --wait --wait-timeout 300 "${services[@]}"
      - name: server versions
        run: |
          for s in $SERVICES; do
            echo "$s: $(docker compose exec -T "$s" psql -U lv -d lvtest -Atc 'select version()')"
          done
      # (1) The PG-as-source code landed so far (phase 1): the parse profile (S4b) and the
      # pg_catalog row mapping (#210). Version-independent unit tests, run once (on the pg16 leg).
      - name: postgres source code (parse profile + pg_catalog)
        env:
          LAZYVIEW_TEST_PG_DSNS: pg16=postgres://lv:lv@127.0.0.1:35432/lvtest
          LAZYVIEW_HEALTH_ADDR: "off"
          LAZYVIEW_TEST_REQUIRE_PG: "1"
        run: |
          scripts/ci-run-binaries.sh ci-bins/ci-manifest.tsv lib -- --color never --exact \
            dialect::postgres::tests::parse_profile_is_the_postgresql_one \
            dialect::postgres::tests::pg_only_constructs_are_refused \
            pgsrc::tests::pg_catalog_rows_build_a_table_info \
            pgsrc::tests::pg_type_inverse_matches_the_target_map \
            pgsrc::tests::keys_need_whole_not_null_columns \
            pgsrc::tests::foreign_keys_keep_only_the_cascading_actions \
            pgsrc::tests::views_are_refused_naming_replica_identity \
            2>&1 | tee pg-source-tests.log
          for t in dialect::postgres::tests::parse_profile_is_the_postgresql_one \
                   dialect::postgres::tests::pg_only_constructs_are_refused \
                   pgsrc::tests::pg_catalog_rows_build_a_table_info \
                   pgsrc::tests::pg_type_inverse_matches_the_target_map \
                   pgsrc::tests::keys_need_whole_not_null_columns \
                   pgsrc::tests::foreign_keys_keep_only_the_cascading_actions \
                   pgsrc::tests::views_are_refused_naming_replica_identity; do
            grep -q "^test $t \.\.\. ok$" pg-source-tests.log || { echo "::error::$t did not run and pass"; exit 1; }
          done
      # (2) The phase-3 logical-replication smoke on the live pin, per source major: the four GA
      # majors that are blocking in the grid (pg14 is the AWS-only tier, pg18 the latest GA) plus the
      # baseline. Each version gets its own server via LAZYVIEW_TEST_PG_DSNS (its own host port),
      # LAZYVIEW_TEST_REQUIRE_PG=1 (a missing server fails) and LAZYVIEW_TEST_STRICT=pgsrc_ (a SKIP
      # fails), so a missing or skipped run fails the grep gate. The binaries came from the
      # build-tests artifact above; each version only runs (fast).
      - name: logical replication smoke (pg16 + pg15 + pg17 + pg18 + pg14, blocking)
        run: |
          smoke() {
            local name=$1 port=$2 log="smoke-$1.log"
            LAZYVIEW_TEST_PG_DSNS="$name=postgres://lv:lv@127.0.0.1:$port/lvtest" \
            LAZYVIEW_HEALTH_ADDR="off" LAZYVIEW_TEST_REQUIRE_PG="1" LAZYVIEW_TEST_STRICT="pgsrc_" \
              scripts/ci-run-binaries.sh ci-bins/ci-manifest.tsv pgsrc_replication -- --color never --exact \
                pgsrc_replication_decodes_insert_update_delete 2>&1 | tee "$log"
            grep -q "^test pgsrc_replication_decodes_insert_update_delete \.\.\. ok$" "$log" \
              || { echo "::error::$name: pgsrc_replication_decodes_insert_update_delete did not run and pass"; exit 1; }
          }
          smoke pg16 35432
          smoke pg15 35431
          smoke pg17 35433
          smoke pg18 35434
          smoke pg14 35436
      # pg19rc2 is the pre-release major: advisory (continue-on-error) — it annotates the run, never
      # blocks it, mirroring the target matrix's advisory pre-release tier. When 19.0 ships, move the
      # pin to postgres:19.x and make this a plain `smoke pg19 35437` in the step above.
      - name: logical replication smoke (pg19rc2, advisory)
        id: smoke19
        continue-on-error: true
        run: |
          LAZYVIEW_TEST_PG_DSNS="pg19rc2=postgres://lv:lv@127.0.0.1:35437/lvtest" \
          LAZYVIEW_HEALTH_ADDR="off" LAZYVIEW_TEST_REQUIRE_PG="1" LAZYVIEW_TEST_STRICT="pgsrc_" \
            scripts/ci-run-binaries.sh ci-bins/ci-manifest.tsv pgsrc_replication -- --color never --exact \
              pgsrc_replication_decodes_insert_update_delete 2>&1 | tee smoke-pg19rc2.log
          grep -q "^test pgsrc_replication_decodes_insert_update_delete \.\.\. ok$" smoke-pg19rc2.log \
            || { echo "::error::pg19rc2 smoke failed"; exit 1; }
      - name: advisory pg19rc2 smoke failed
        if: steps.smoke19.outcome == 'failure'
        run: |
          echo "::warning title=advisory source failed::pg19rc2 is the pre-release PostgreSQL major (advisory, tested but not required for a release): see the pgsrc smoke logs"
          echo "### :warning: pg19rc2: advisory PostgreSQL source smoke failed" >> "$GITHUB_STEP_SUMMARY"
          echo "PostgreSQL 19rc2 failed the logical-replication source smoke. It does not block this run; check the logs before 19.0 ships, when the leg becomes blocking." >> "$GITHUB_STEP_SUMMARY"
      - name: collect server logs
        if: failure()
        run: |
          mkdir -p server-logs
          for s in $SERVICES; do
            docker compose logs --no-color --timestamps "$s" > "server-logs/$s.log" 2>&1 || true
          done
          docker compose ps --all > server-logs/compose-ps.txt 2>&1 || true
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs-pgsrc-server
          path: |
            server-logs/
            tmp/out/test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: stop the servers
        if: always()
        run: docker compose down -v

  e2e:
    name: image smoke + end-to-end
    if: github.event_name != 'schedule' && github.event_name != 'workflow_call' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)  # the nightly runs only the soak jobs; a draft PR runs only the fast jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AMD64_IMAGE: lazyview:ci-amd64
      ARM64_IMAGE: lazyview:ci-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # QEMU only runs the finished arm64 image for its smoke test; the Dockerfile
      # cross-compiles on the runner platform (no emulation during the build).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The per-platform GitHub Actions caches written here are what the publish
      # job (publish-image.yml) builds from, so it only assembles and pushes.
      - name: build linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.AMD64_IMAGE }}
          build-args: |
            REVISION=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max
      - name: smoke test linux/amd64
        run: make docker-smoke IMAGE="$AMD64_IMAGE"
      - name: binary version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          got=$(docker run --rm "$AMD64_IMAGE" --version)
          want="lazyview ${GITHUB_REF_NAME#v}"
          if [[ $got != "$want" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} but the binary reports '${got}': bump the version in Cargo.toml"
            exit 1
          fi

      # The shell-free image against a real MySQL 8.4, via the documented compose example.
      - name: end-to-end (docker-compose.example.yml)
        timeout-minutes: 15
        env:
          LAZYVIEW_IMAGE: ${{ env.AMD64_IMAGE }}
        run: |
          dc() { docker compose -f docker-compose.example.yml "$@"; }
          sql() { dc exec -T mysql mysql -ulazyview -plazyview -NB app -e "$1" 2>/dev/null; }
          wait_for() {
            local got=
            for _ in $(seq 90); do
              got=$(sql "$1" || true)
              if [[ $got == "$2" ]]; then echo "ok: $1 -> $2"; return 0; fi
              sleep 2
            done
            echo "::error::timeout: '$1' returned '${got}', want '$2'"
            return 1
          }
          # Two runs (quick start): the one-shot lazyview-setup container runs `lazyview setup`,
          # then the service starts. It must exit 0 — never make the operations run migrate.
          dc up -d --no-build --quiet-pull --wait --wait-timeout 300
          scid=$(dc ps -aq lazyview-setup)
          test "$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' "$scid")" = "exited 0" \
            || { echo "::error::the lazyview setup run did not exit 0"; dc logs --no-color lazyview-setup; exit 1; }
          cid=$(dc ps -q lazyview)
          test "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy
          # The service process really runs as 65532 (not just the image config).
          pid=$(docker inspect -f '{{.State.Pid}}' "$cid")
          ids=$(awk '/^(Uid|Gid):/ { printf "%s %s ", $1, $2 }' "/proc/${pid}/status")
          echo "lazyview process: ${ids}"
          test "$ids" = "Uid: 65532 Gid: 65532 "
          wait_for "SELECT COUNT(*) FROM _lazyview" 0
          sql "CREATE TABLE orders (id INT PRIMARY KEY, customer VARCHAR(50), total DECIMAL(10,2));
               INSERT INTO orders VALUES (1,'ann',10),(2,'bob',5),(3,'ann',7);
               INSERT INTO _lazyview (definition) VALUES ('CREATE VIEW customer_totals AS SELECT customer, SUM(total) AS total, COUNT(*) AS n FROM orders GROUP BY customer');"
          wait_for "SELECT state FROM _lazyview_state WHERE name = 'customer_totals'" ready
          wait_for "SELECT n FROM customer_totals WHERE customer = 'bob'" 1
          # Incremental maintenance from the binlog: insert, update, delete.
          sql "INSERT INTO orders VALUES (4,'bob',1)"
          wait_for "SELECT CONCAT(n, ' ', CAST(total AS DECIMAL(10,2))) FROM customer_totals WHERE customer = 'bob'" "2 6.00"
          sql "UPDATE orders SET total = 20 WHERE id = 1"
          wait_for "SELECT CONCAT(n, ' ', CAST(total AS DECIMAL(10,2))) FROM customer_totals WHERE customer = 'ann'" "2 27.00"
          sql "DELETE FROM orders WHERE id = 3"
          wait_for "SELECT CONCAT(n, ' ', CAST(total AS DECIMAL(10,2))) FROM customer_totals WHERE customer = 'ann'" "1 20.00"
          test "$(docker inspect -f '{{.State.Health.Status}} {{.RestartCount}}' "$cid")" = "healthy 0"
      - name: end-to-end logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          docker compose -f docker-compose.example.yml ps --all > e2e-logs/compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.example.yml logs --no-color --timestamps > e2e-logs/compose.log 2>&1 || true
          tail -n 200 e2e-logs/compose.log
      - name: upload end-to-end logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: end-to-end cleanup
        if: always()
        run: docker compose -f docker-compose.example.yml down -v

      - name: build linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.ARM64_IMAGE }}
          build-args: |
            REVISION=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-arm64
          cache-to: type=gha,scope=image-arm64,mode=max
      - name: smoke test linux/arm64 (QEMU)
        run: |
          test "$(docker image inspect "$ARM64_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
          make docker-smoke IMAGE="$ARM64_IMAGE"

  scan-image:
    name: image scan (trivy)
    # Needs e2e so the GHA build cache below is warm: this rebuild is a cache hit.
    needs: e2e
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft  # a draft PR runs only the fast jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Pinned supply-chain tools: exact version + sha256, never a floating tag.
      TRIVY_VERSION: "0.76.2"
      TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
      SCAN_IMAGE: lazyview:ci-scan-amd64
      # Official sources for the vulnerability DB, tried in order: ghcr.io first
      # (reachable from GitHub runners, unlike public.ecr.org on some networks:
      # run 43877158353 dialed public.ecr.org into a blackhole and trivy aborted
      # without falling through to the next source), then the ECR mirror, so an
      # anonymous ghcr rate-limit cannot make the gate flaky either.
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.org/aqua/trivy-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build linux/amd64 (cache hit from the e2e job)
        # The same Dockerfile publish-image.yml publishes, so what is scanned
        # is what ships (default features, distroless, nonroot).
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.SCAN_IMAGE }}
          build-args: |
            REVISION=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image-amd64
      - name: install pinned trivy
        run: |
          curl -fsSLo trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          ./trivy --version
      - name: scan the image
        # HIGH and CRITICAL fail the job; required by `release` (S-09).
        # --ignore-unfixed keeps the gate on what a rebuild can actually remove:
        # an unfixed-upstream finding is a log note, not a permanent red (the
        # dependency source fixes arrive by bumping the base image / lockfile).
        run: |
          ./trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$SCAN_IMAGE"

  image:
    name: publish edge
    needs: [lint, unit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/publish-image.yml

  release:
    name: publish release
    # The supply-chain gate (deny + scan-image) and the optional-features builds are
    # required here (S-09): an advisory job gates nothing, so they are hard needs.
    needs: [lint, unit, e2e, integration, integration-multi, deny, features, scan-image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/publish-image.yml

  # ---- Soak jobs (tests/soak.rs). All strict: LAZYVIEW_TEST_STRICT=soak_ is the harness's own
  # strict mode (tests/common, from the tests-strict-targets PR), so a skipped soak scenario
  # fails the job instead of printing a green SKIP line. soak-pr runs on every pull request;
  # soak-smoke is the nightly's (nightly.yml calls this workflow on the schedule) and a manual run
  # of this workflow, so a branch can prove them before merge. Both are bounded: the long soak
  # (tests/soak.rs soak_long) runs locally, not here (see the header). ----

  soak-pr:
    # The bounded soak on pull requests: 5 minutes (LAZYVIEW_TEST_SOAK_MINUTES) on mysql84, as
    # a job of its own so the PR shows it as a check that runs, and tee+grep makes a run that
    # never executed the soak impossible: soak_smoke_30m must show as passed in the log. What the
    # 5-minute bound proves: the writers, the views and the checks run and settle for that
    # window. The full five kinds of smoke chaos need the nightly's 30-minute smoke (10 events
    # per hour).
    name: soak smoke (mysql84, bounded 5 min)
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}  # a draft PR runs only the fast jobs; marking it ready starts this (and it needs the build-tests binaries)
    needs: build-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.test.yml
      FLAVOR: mysql84
      # The engine the harness spawns: this job compiles nothing, the binary is the artifact's.
      LAZYVIEW_TEST_ENGINE_BIN: ci-bins/lazyview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: get the test binaries (built once by build-tests)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-bins
          path: ci-bins
      - run: chmod +x ci-bins/deps/* ci-bins/lazyview
      - name: start mysql84 (in the background)
        run: docker compose up -d --quiet-pull "$FLAVOR"
      - name: wait for mysql84
        run: docker compose up -d --wait --wait-timeout 300 "$FLAVOR"
      - name: server version
        run: docker compose exec -T "$FLAVOR" sh -c 'exec "$(command -v mariadb || command -v mysql)" --protocol=TCP -h127.0.0.1 -ulv -plv -NB -e "SELECT VERSION()"'
      - name: soak smoke (5 minutes)
        timeout-minutes: 15
        env:
          LAZYVIEW_TEST_DSNS: mysql84=mysql://lv:lv@127.0.0.1:33084/lvtest
          LAZYVIEW_HEALTH_ADDR: "off"
          LAZYVIEW_TEST_ENGINE_USER: lvdoc:doc
          LAZYVIEW_TEST_SOAK: smoke
          LAZYVIEW_TEST_SOAK_MINUTES: "5"
          LAZYVIEW_TEST_STRICT: soak_
        shell: bash
        run: |
          scripts/ci-run-binaries.sh ci-bins/ci-manifest.tsv soak -- --test-threads=1 --color never soak_smoke_30m 2>&1 | tee soak-pr.log
          grep -q "^test soak_smoke_30m \.\.\. ok$" soak-pr.log \
            || { echo "::error::soak_smoke_30m did not run and pass (the bounded soak skipped?)"; exit 1; }
      - name: upload the soak report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-pr-mysql84
          path: tmp/out/lvs-soak/
          retention-days: 14
          if-no-files-found: ignore
      - name: stop mysql84
        if: always()
        run: docker compose down -v

  soak-smoke:
    # Nightly (and a manual run): the 30-minute smoke on both LTS flavors, each on its own
    # server. The test runs its own clock (tests/soak.rs SMOKE_MINUTES): 30 minutes plus the
    # test's 30-minute margin, then the build and the server start inside the 75-minute job.
    name: soak smoke (${{ matrix.flavor }})
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: mysql84
            port: 33084
          - flavor: mariadb1011
            port: 33111
    env:
      COMPOSE_FILE: docker-compose.test.yml
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: start ${{ matrix.flavor }} (in the background)
        run: docker compose up -d --quiet-pull "$FLAVOR"
      - name: rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Reads the shared `integration` cache (build-tests is its one writer, on pushes and
          # ready PRs); on the nightly this job is the only builder, but it stays a reader so the
          # cache has a single writer.
          shared-key: integration
          save-if: false
      - name: build the soak tests
        run: cargo test --locked --test soak --no-run
      - name: wait for ${{ matrix.flavor }}
        run: docker compose up -d --wait --wait-timeout 300 "$FLAVOR"
      - name: server version
        run: docker compose exec -T "$FLAVOR" sh -c 'exec "$(command -v mariadb || command -v mysql)" --protocol=TCP -h127.0.0.1 -ulv -plv -NB -e "SELECT VERSION()"'
      - name: soak smoke (30 minutes)
        timeout-minutes: 65
        env:
          LAZYVIEW_TEST_DSNS: ${{ matrix.flavor }}=mysql://lv:lv@127.0.0.1:${{ matrix.port }}/lvtest
          LAZYVIEW_HEALTH_ADDR: "off"
          LAZYVIEW_TEST_ENGINE_USER: lvdoc:doc
          LAZYVIEW_TEST_SOAK: smoke
          LAZYVIEW_TEST_STRICT: soak_
        run: cargo test --locked --test soak -- --test-threads=1 soak_smoke_30m
      - name: upload the soak report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-smoke-${{ matrix.flavor }}
          path: tmp/out/lvs-soak/
          retention-days: 14
          if-no-files-found: ignore
      - name: stop ${{ matrix.flavor }}
        if: always()
        run: docker compose down -v

  report:
    # The nightly's own reporter (schedule and the nightly call only; a manual run never writes
    # to the issue tracker): a failed nightly opens or updates the one open issue labelled
    # `nightly` (GITHUB_TOKEN with issues: write; no secret). Only the soak jobs are in needs:
    # a scheduled run is the soak (the regular jobs above already ran on the push to main), and the
    # network-chaos scenarios run inside those integration jobs on the push, so they are not here.
    name: report failed nightly
    needs: [soak-smoke]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_call') && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: open or update the nightly issue
        run: |
          set -euo pipefail
          body="Nightly soak run failed on main: $RUN_URL

          Job results (from the run): $RESULTS

          The network-chaos scenarios run inside the integration jobs of the push to main, not here: check their logs in that push's run."
          gh label create nightly --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Failed nightly run on main" --force
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label nightly \
              --title "Nightly soak run failed on main" --body "$body"
          fi
