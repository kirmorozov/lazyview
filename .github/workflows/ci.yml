name: ci

# lint, unit, e2e, integration and integration-multi run on every push and pull request.
# Images are published to ghcr.io/kirmorozov/lazyview only for pushes:
#   main  -> `image`   (needs lint + unit + e2e; the integration jobs run alongside, not required)
#   v*    -> `release` (needs lint + unit + e2e + the integration matrix + the multi-server job;
#                       the matrix's advisory pre-release entries run with continue-on-error and
#                       cannot block it)
# Pull requests never get registry credentials and never push.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer run for the same ref and event cancels the superseded one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the rust image in the Dockerfile.
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test --lib --bins
        run: cargo test --locked --lib --bins

  integration:
    # One job per server flavor of docker-compose.test.yml (docs/server-setup.md "Supported
    # servers"): the blocking matrix (oldest supported LTS + latest GA per product) must pass,
    # the advisory pre-releases only annotate the run when they fail (continue-on-error).
    name: integration (${{ matrix.flavor }}${{ matrix.advisory && ', advisory' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        # Service names and host ports from docker-compose.test.yml.
        include:
          - { flavor: mysql84, port: 33084, advisory: false }
          - { flavor: mysql267, port: 33267, advisory: false }
          - { flavor: percona84, port: 33184, advisory: false }
          - { flavor: percona97, port: 33197, advisory: false }
          - { flavor: mariadb1011, port: 33111, advisory: false }
          - { flavor: mariadb130, port: 33130, advisory: false }
          # Newest pre-releases (compose profile `prerelease`): never required.
          - { flavor: mariadb132-pre, port: 33132, advisory: true }
          - { flavor: mysql2610-pre, port: 33261, advisory: true }
    env:
      COMPOSE_FILE: docker-compose.test.yml
      COMPOSE_PROFILES: prerelease
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # MySQL 26.10 Early Access has no registry image: `docker load` the labs tarball
      # (sha256-verified by the script).
      - name: load the ${{ matrix.flavor }} image
        if: matrix.flavor == 'mysql2610-pre'
        run: scripts/test-servers.sh compose load-pre
      - name: start ${{ matrix.flavor }} (in the background)
        run: docker compose up -d --quiet-pull "$FLAVOR"
      - name: rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: integration
          # One writer for the matrix jobs; the test binaries compile even when tests fail.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.flavor == 'mysql84' }}
          cache-on-failure: true
      - name: build integration tests
        run: cargo test --locked --test '*' --no-run
      - name: wait for ${{ matrix.flavor }}
        run: docker compose up -d --wait --wait-timeout 300 "$FLAVOR"
      - name: server version
        run: docker compose exec -T "$FLAVOR" sh -c 'exec "$(command -v mariadb || command -v mysql)" --protocol=TCP -h127.0.0.1 -ulv -plv -NB -e "SELECT VERSION()"'
      - name: integration tests
        timeout-minutes: 75
        env:
          LAZYVIEW_TEST_DSNS: ${{ matrix.flavor }}=mysql://lv:lv@127.0.0.1:${{ matrix.port }}/lvtest
          LAZYVIEW_HEALTH_ADDR: "off"
          # Suites run one binary at a time here, so the DST test may change GLOBAL time_zone.
          LAZYVIEW_TEST_GLOBAL_TZ: "1"
          # One server here: the multi-server scenarios skip (visibly) instead of failing, which
          # the harness does by default when CI is set; integration-multi runs them.
          LAZYVIEW_TEST_REQUIRE_MULTI: "0"
        # --no-fail-fast: run every suite and report all failures, not just the first.
        run: cargo test --locked --no-fail-fast --test '*' -- --test-threads=1
      - name: advisory flavor failed
        if: failure() && matrix.advisory
        run: |
          echo "::warning title=advisory server failed::${FLAVOR} is a pre-release server (advisory, not required for a release): see the integration logs"
          echo "### :warning: ${FLAVOR}: advisory pre-release server failed" >> "$GITHUB_STEP_SUMMARY"
          echo "A pre-release server failed the integration suites. It does not block this run; check the logs before the release that moves the latest-GA pin." >> "$GITHUB_STEP_SUMMARY"
      - name: collect server logs
        if: failure()
        run: |
          mkdir -p server-logs
          docker compose logs --no-color --timestamps "$FLAVOR" > "server-logs/${FLAVOR}.log" 2>&1 || true
          docker compose ps --all > server-logs/compose-ps.txt 2>&1 || true
      # Server log plus the engine logs the harness keeps for failed tests
      # (tmp/out/test-logs/<schema>/engine-<n>.log).
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs-${{ matrix.flavor }}
          path: |
            server-logs/
            tmp/out/test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: stop ${{ matrix.flavor }}
        if: always()
        run: docker compose down -v

  integration-multi:
    # The multi-server scenarios (a source replicating into targets on other servers; the
    # single-flavor jobs above skip them): every listed server is the source once, the next
    # ones in the list its targets. Three blocking flavors across the products and versions:
    # MySQL 8.4 LTS, Percona 9.7 and MariaDB 13.0, whose default utf8mb4_uca1400_ai_ci
    # collation the MySQL targets lack.
    name: integration (multi-server, mysql84 + percona97 + mariadb130)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_FILE: docker-compose.test.yml
      SERVICES: mysql84 percona97 mariadb130
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: start the servers (in the background)
        run: |
          read -ra services <<<"$SERVICES"
          docker compose up -d --quiet-pull "${services[@]}"
      - name: rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Reads the integration matrix's cache (its mysql84 job writes it).
          shared-key: integration
          save-if: false
      - name: build the targets and regressions tests
        run: cargo test --locked --test targets --test regressions --no-run
      - name: wait for the servers
        run: |
          read -ra services <<<"$SERVICES"
          docker compose up -d --wait --wait-timeout 300 "${services[@]}"
      - name: server versions
        run: |
          for s in $SERVICES; do
            echo "$s: $(docker compose exec -T "$s" sh -c 'exec "$(command -v mariadb || command -v mysql)" --protocol=TCP -h127.0.0.1 -ulv -plv -NB -e "SELECT VERSION()"')"
          done
      - name: multi-server tests
        timeout-minutes: 45
        env:
          LAZYVIEW_TEST_DSNS: mysql84=mysql://lv:lv@127.0.0.1:33084/lvtest,percona97=mysql://lv:lv@127.0.0.1:33197/lvtest,mariadb130=mysql://lv:lv@127.0.0.1:33130/lvtest
          LAZYVIEW_HEALTH_ADDR: "off"
          # A multi-server scenario that finds too few servers fails here instead of skipping.
          LAZYVIEW_TEST_REQUIRE_MULTI: "1"
        shell: bash
        # Every test of tests/targets.rs plus the regression's multi-target scenario; the four
        # known ones must show up as passed (a rename would otherwise leave this job green
        # without running them).
        run: |
          cargo test --locked --no-fail-fast --test targets --test regressions -- --test-threads=1 \
            --color never targets_ reg_multi_target_with_one_down 2>&1 | tee multi-server-tests.log
          for t in targets_fan_out_and_retarget targets_invalid_configurations_error \
                   targets_one_target_down reg_multi_target_with_one_down; do
            grep -q "^test $t \.\.\. ok$" multi-server-tests.log || { echo "::error::$t did not run and pass"; exit 1; }
          done
      - name: collect server logs
        if: failure()
        run: |
          mkdir -p server-logs
          for s in $SERVICES; do
            docker compose logs --no-color --timestamps "$s" > "server-logs/$s.log" 2>&1 || true
          done
          docker compose ps --all > server-logs/compose-ps.txt 2>&1 || true
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs-multi-server
          path: |
            server-logs/
            tmp/out/test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: stop the servers
        if: always()
        run: docker compose down -v

  e2e:
    name: image smoke + end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AMD64_IMAGE: lazyview:ci-amd64
      ARM64_IMAGE: lazyview:ci-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # QEMU only runs the finished arm64 image for its smoke test; the Dockerfile
      # cross-compiles on the runner platform (no emulation during the build).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The per-platform GitHub Actions caches written here are what the publish
      # job (publish-image.yml) builds from, so it only assembles and pushes.
      - name: build linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.AMD64_IMAGE }}
          build-args: |
            REVISION=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max
      - name: smoke test linux/amd64
        run: make docker-smoke IMAGE="$AMD64_IMAGE"
      - name: binary version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          got=$(docker run --rm "$AMD64_IMAGE" --version)
          want="lazyview ${GITHUB_REF_NAME#v}"
          if [[ $got != "$want" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} but the binary reports '${got}': bump the version in Cargo.toml"
            exit 1
          fi

      # The shell-free image against a real MySQL 8.4, via the documented compose example.
      - name: end-to-end (docker-compose.example.yml)
        timeout-minutes: 15
        env:
          LAZYVIEW_IMAGE: ${{ env.AMD64_IMAGE }}
        run: |
          dc() { docker compose -f docker-compose.example.yml "$@"; }
          sql() { dc exec -T mysql mysql -ulazyview -plazyview -NB app -e "$1" 2>/dev/null; }
          wait_for() {
            local got=
            for _ in $(seq 90); do
              got=$(sql "$1" || true)
              if [[ $got == "$2" ]]; then echo "ok: $1 -> $2"; return 0; fi
              sleep 2
            done
            echo "::error::timeout: '$1' returned '${got}', want '$2'"
            return 1
          }
          dc up -d --no-build --quiet-pull --wait --wait-timeout 300
          cid=$(dc ps -q lazyview)
          test "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy
          # The service process really runs as 65532 (not just the image config).
          pid=$(docker inspect -f '{{.State.Pid}}' "$cid")
          ids=$(awk '/^(Uid|Gid):/ { printf "%s %s ", $1, $2 }' "/proc/${pid}/status")
          echo "lazyview process: ${ids}"
          test "$ids" = "Uid: 65532 Gid: 65532 "
          wait_for "SELECT COUNT(*) FROM _lazyview" 0
          sql "CREATE TABLE orders (id INT PRIMARY KEY, customer VARCHAR(50), total DECIMAL(10,2));
               INSERT INTO orders VALUES (1,'ann',10),(2,'bob',5),(3,'ann',7);
               INSERT INTO _lazyview (definition) VALUES ('CREATE VIEW customer_totals AS SELECT customer, SUM(total) AS total, COUNT(*) AS n FROM orders GROUP BY customer');"
          wait_for "SELECT state FROM _lazyview_state WHERE name = 'customer_totals'" ready
          wait_for "SELECT n FROM customer_totals WHERE customer = 'bob'" 1
          # Incremental maintenance from the binlog: insert, update, delete.
          sql "INSERT INTO orders VALUES (4,'bob',1)"
          wait_for "SELECT CONCAT(n, ' ', CAST(total AS DECIMAL(10,2))) FROM customer_totals WHERE customer = 'bob'" "2 6.00"
          sql "UPDATE orders SET total = 20 WHERE id = 1"
          wait_for "SELECT CONCAT(n, ' ', CAST(total AS DECIMAL(10,2))) FROM customer_totals WHERE customer = 'ann'" "2 27.00"
          sql "DELETE FROM orders WHERE id = 3"
          wait_for "SELECT CONCAT(n, ' ', CAST(total AS DECIMAL(10,2))) FROM customer_totals WHERE customer = 'ann'" "1 20.00"
          test "$(docker inspect -f '{{.State.Health.Status}} {{.RestartCount}}' "$cid")" = "healthy 0"
      - name: end-to-end logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          docker compose -f docker-compose.example.yml ps --all > e2e-logs/compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.example.yml logs --no-color --timestamps > e2e-logs/compose.log 2>&1 || true
          tail -n 200 e2e-logs/compose.log
      - name: upload end-to-end logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: end-to-end cleanup
        if: always()
        run: docker compose -f docker-compose.example.yml down -v

      - name: build linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.ARM64_IMAGE }}
          build-args: |
            REVISION=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-arm64
          cache-to: type=gha,scope=image-arm64,mode=max
      - name: smoke test linux/arm64 (QEMU)
        run: |
          test "$(docker image inspect "$ARM64_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
          make docker-smoke IMAGE="$ARM64_IMAGE"

  image:
    name: publish edge
    needs: [lint, unit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/publish-image.yml

  release:
    name: publish release
    needs: [lint, unit, e2e, integration, integration-multi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/publish-image.yml
