name: nightly

# Nightly proof of main HEAD (the default branch at schedule time) of what a push to main does
# not run: since #236 every push runs the full matrix, multi-server, chaos (both flavors) and
# the PostgreSQL legs on the landed commit itself, so this schedule adds only the soak:
#   soak-smoke  the 30-minute smoke on mysql84 and mariadb1011, nightly (02:17 UTC)
#   report      a failed nightly opens or updates the one open issue labelled `nightly`
# Those jobs live in ci.yml (gated to schedule, workflow_call and a manual run, with every
# regular job skipping there), so a workflow_dispatch of ci.yml on a branch can prove them
# before merge; this wrapper only owns the schedule and calls ci.yml. The long soak
# (tests/soak.rs soak_long) is not scheduled here: GitHub Actions have time limits, so it runs
# locally as a release gate through tmp/lvs-suite.sh.
on:
  schedule:
    - cron: "17 2 * * *"   # nightly, 02:17 UTC
  workflow_dispatch:

# A nightly run never cancels another one.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full:
    name: nightly (ci.yml)
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      issues: write
      # The nightly is ci.yml called as a reusable workflow, so this caller sets the GITHUB_TOKEN
      # permission ceiling for the whole called graph, and GitHub checks every job in that graph
      # against it at startup (a `if`-skipped job counts). ci.yml's `image` and `release` jobs ask
      # for these three scopes to publish and attest; the schedule skips them (the nightly runs
      # only the soak jobs), but without the ceiling granted here the whole run is rejected before
      # any job starts as `startup_failure` with "The nested job 'image' is requesting
      # '… packages: write …', but is only allowed '… packages: none …'". No soak job uses them.
      packages: write
      attestations: write
      id-token: write
